<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Directory — Store 646202</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--border:#e2e8f0;
  --accent2:#1e3a5f;--text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);padding:16px;font-size:14px}

.add-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.add-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:8px}
.add-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;font-weight:600;color:var(--text2)}
.fi{font-family:var(--font);font-size:13px;border:1px solid var(--border);border-radius:6px;padding:6px 9px;outline:none;background:var(--surface);color:var(--text)}
.fi:focus{border-color:var(--accent2)}

.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:nowrap}
.count{font-size:12px;color:var(--text3);margin-left:auto;white-space:nowrap}

.btn{display:inline-flex;align-items:center;padding:5px 11px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn-primary:hover{background:#162d4a}
.btn-edit{background:#f0fdf4;color:#15803d;border-color:#86efac}
.btn-save{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn-del{border-color:#fca5a5;color:#dc2626}
.btn-del:hover{background:#fef2f2}

.table-wrap{display:inline-block;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden;vertical-align:top}
table{width:auto;border-collapse:collapse}
thead{background:var(--surface2)}
th{padding:7px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
th.s{cursor:pointer}
th.s:hover{color:var(--text2);background:#e8edf2}
th.sa{color:var(--accent2)}
th.sa .si{opacity:1;color:var(--accent2)}
.si{margin-left:2px;opacity:.4;font-size:9px}
td{padding:6px 10px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
tr.ck td{background:#eff6ff}

.ed{display:block;padding:2px 4px;border-radius:4px;border:1px solid transparent;outline:none}
.ed:hover{border-color:var(--border);background:var(--surface2);cursor:text}
.ed:focus{border-color:var(--accent2);background:var(--surface)}
.ed.locked{cursor:default!important}
.ed.locked:hover{border-color:transparent!important;background:transparent!important}

.ph-link{font-family:var(--mono);font-size:13px;color:var(--accent2);text-decoration:none;font-weight:600}
.ph-link:hover{text-decoration:underline}

.act-bar{display:none;gap:4px;align-items:center}
input[type=checkbox]{cursor:pointer;width:14px;height:14px;accent-color:var(--accent2)}
</style>
</head>
<body>

<!-- ADD FORM -->
<div class="add-card">
  <div class="add-title">Add Contact</div>
  <div class="add-row">
    <div class="field"><label>Name</label>
      <input class="fi" id="a-name" style="width:140px" placeholder="Business name">
    </div>
    <div class="field"><label>Phone</label>
      <input class="fi" id="a-phone" style="width:130px;font-family:var(--mono)" placeholder="5855551234">
    </div>
    <div class="field"><label>Ext</label>
      <input class="fi" id="a-ext" style="width:55px;font-family:var(--mono)" placeholder="0">
    </div>
    <div class="field"><label>Contact / Rep Name</label>
      <input class="fi" id="a-contact" style="width:130px" placeholder="First name">
    </div>
    <div class="field" style="flex:1;min-width:160px"><label>Title / Notes</label>
      <input class="fi" id="a-title" placeholder="Company or description">
    </div>
    <div class="field"><label>&nbsp;</label>
      <button class="btn btn-primary" onclick="addContact()">+ Add</button>
    </div>
  </div>
</div>

<!-- TOOLBAR + TABLE -->
<div style="display:inline-block;vertical-align:top;min-width:0">
<div class="toolbar">
  <input class="fi" id="srch" placeholder="🔍 Search contacts..." oninput="render()" style="width:220px">
  <span class="count" id="ph-count"></span>
</div>

<div class="table-wrap">
<table>
  <thead><tr>
    <th style="width:28px;text-align:center;padding:6px 4px">
      <input type="checkbox" id="chk-all" onclick="toggleAll(this)">
    </th>
    <th class="s" onclick="sortBy('name')" id="th-name">Name <span class="si" id="si-name"></span></th>
    <th class="s" onclick="sortBy('phone')" id="th-phone">Phone <span class="si" id="si-phone"></span></th>
    <th class="s" onclick="sortBy('contact')" id="th-contact">Contact <span class="si" id="si-contact"></span></th>
    <th class="s" onclick="sortBy('title')" id="th-title">Title / Notes <span class="si" id="si-title"></span></th>
    <th style="padding:5px 8px">
      <div class="act-bar" id="act-bar">
        <button class="btn btn-edit" style="padding:3px 9px;font-size:11px" onclick="editCk()">Edit</button>
        <button class="btn btn-save" style="padding:3px 9px;font-size:11px" id="g-save" onclick="saveCk()">Save</button>
        <button class="btn btn-del" style="padding:3px 9px;font-size:11px" onclick="delCk()">Del</button>
      </div>
    </th>
  </tr></thead>
  <tbody id="ph-body"></tbody>
</table>
</div>
</div>

<script>
const BUILTIN = [{"name": "ScrapHappy", "phone": "5857368035", "contact": "", "title": "Scrap / Recycling", "ext": ""}, {"name": "Jason (Empire)", "phone": "5856673120", "contact": "Jason", "title": "Empire Auto", "ext": ""}, {"name": "Opus", "phone": "8666238378", "contact": "", "title": "Opus (Acct #7067451)", "ext": ""}, {"name": "Helpdesk", "phone": "8886880888", "contact": "", "title": "IT Helpdesk", "ext": ""}, {"name": "Advance Auto", "phone": "5857879345", "contact": "", "title": "Advance Auto Parts", "ext": ""}, {"name": "Advance Rob", "phone": "5856421466", "contact": "Rob", "title": "Advance Auto \u2014 Rep", "ext": ""}, {"name": "AutoZone", "phone": "5858725570", "contact": "", "title": "AutoZone", "ext": ""}, {"name": "AutoZone Marisol", "phone": "5856736624", "contact": "Marisol", "title": "AutoZone \u2014 Rep", "ext": ""}, {"name": "Haun", "phone": "5852654427", "contact": "", "title": "Haun Welding Supply", "ext": ""}, {"name": "Securitas Alarm", "phone": "8006894984", "contact": "", "title": "Alarm / Security", "ext": ""}, {"name": "Hunter Engineering", "phone": "8884507100", "contact": "", "title": "Hunter Engineering", "ext": ""}, {"name": "Hertz", "phone": "8889995980", "contact": "", "title": "Hertz", "ext": ""}, {"name": "ATEQ", "phone": "8886218767", "contact": "", "title": "ATEQ (TPMS Tools)", "ext": ""}, {"name": "Autel", "phone": "8664960058", "contact": "", "title": "Autel Diagnostics", "ext": ""}, {"name": "Coats", "phone": "8006886359", "contact": "", "title": "Coats (Equipment)", "ext": ""}, {"name": "Inventory Services", "phone": "8556057324", "contact": "", "title": "Inventory Services", "ext": ""}, {"name": "JS Products", "phone": "8002557011", "contact": "", "title": "JS Products", "ext": ""}, {"name": "JohnDow Industries", "phone": "8004330708", "contact": "", "title": "JohnDow Industries", "ext": ""}, {"name": "Mitchell 1", "phone": "8887246742", "contact": "", "title": "Mitchell 1 (Software)", "ext": ""}, {"name": "Robinair", "phone": "8008225561", "contact": "", "title": "Robinair (AC Equipment)", "ext": ""}, {"name": "Rotary", "phone": "8009435438", "contact": "", "title": "Rotary (Lifts)", "ext": ""}, {"name": "Staples Advantage", "phone": "8778267755", "contact": "", "title": "Acct #1829070", "ext": ""}, {"name": "Launch X431", "phone": "8775286249", "contact": "", "title": "Launch Diagnostics", "ext": "4"}, {"name": "DOC Floor Scrubbers", "phone": "8554852113", "contact": "", "title": "DOC (Floor Equipment)", "ext": ""}, {"name": "Redline Smoke Machines", "phone": "7144511411", "contact": "", "title": "Redline Smoke Machines", "ext": ""}, {"name": "Emergency Spill Response", "phone": "8443473844", "contact": "", "title": "Emergency Spill Response", "ext": ""}];
let contacts = BUILTIN.slice();
let serverLoaded = false;

function fmtPhone(p) {
  p=(p||'').replace(/\D/g,'');
  if(p.length===10) return '('+p.slice(0,3)+') '+p.slice(3,6)+'-'+p.slice(6);
  if(p.length===11) return '+'+p[0]+' ('+p.slice(1,4)+') '+p.slice(4,7)+'-'+p.slice(7);
  return p;
}

// SORT
let sField=null,sDir=1;
function sortBy(f) {
  if(sField===f) sDir*=-1; else{sField=f;sDir=1;}
  document.querySelectorAll('th[id^="th-"]').forEach(t=>t.classList.remove('sa'));
  document.querySelectorAll('.si').forEach(s=>s.textContent='');
  const th=document.getElementById('th-'+f),si=document.getElementById('si-'+f);
  if(th) th.classList.add('sa');
  if(si) si.textContent=sDir===1?'▲':'▼';
  render();
}
function sorted(arr) {
  if(!sField) return arr;
  return [...arr].sort((a,b)=>{
    const av=(a[sField]||'').toLowerCase(),bv=(b[sField]||'').toLowerCase();
    return av<bv?-sDir:av>bv?sDir:0;
  });
}

// SAVE
function save() {
  try{localStorage.setItem('phonebook646202',JSON.stringify(contacts));}catch(e){}
  if(!serverLoaded) return;
  fetch('/data/phonebook.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(contacts)}).catch(()=>{});
}

// RENDER
function render() {
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const filtered=sorted(contacts.filter(c=>
    !q||(c.name+' '+c.phone+' '+(c.contact||'')+' '+(c.title||'')).toLowerCase().includes(q)
  ));
  document.getElementById('ph-count').textContent=filtered.length+' of '+contacts.length+' contacts';
  const tbody=document.getElementById('ph-body');
  if(!filtered.length){
    tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text3)">No contacts match</td></tr>';
    return;
  }
  tbody.innerHTML=filtered.map(c=>{
    const isChk=ckd.has(c.name);
    const rid='r-'+c.name.replace(/[^a-z0-9]/gi,'_');
    const nid='n-'+c.name.replace(/[^a-z0-9]/gi,'_');
    const dialNum='tel:+'+(c.phone||'').replace(/\D/g,'');
    const dispPhone=fmtPhone(c.phone)+(c.ext?' x'+c.ext:'');
    return `<tr id="${rid}"${isChk?' class="ck"':''}>
      <td style="text-align:center;padding:6px 4px">
        <input type="checkbox" class="rchk" data-name="${c.name}" onchange="onChk('${c.name}',this.checked)"${isChk?' checked':''}>
      </td>
      <td style="font-weight:600">
        <span class="ed locked" id="${nid}" contenteditable="false" spellcheck="false"
          onblur="onEdit('${c.name}','name',this.innerText.trim());lockEl('${nid}')"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
          style="min-width:100px"
        >${c.name}</span>
      </td>
      <td><a href="${dialNum}" class="ph-link">${dispPhone}</a></td>
      <td>
        <span class="ed" contenteditable="true" spellcheck="false"
          onblur="onEdit('${c.name}','contact',this.innerText.trim())"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
          style="min-width:80px;color:var(--text2)"
        >${c.contact||''}</span>
      </td>
      <td>
        <span class="ed" contenteditable="true" spellcheck="false"
          onblur="onEdit('${c.name}','title',this.innerText.trim())"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
          style="min-width:140px"
        >${c.title||''}</span>
      </td>
      <td style="padding:6px 8px"></td>
    </tr>`;
  }).join('');
}

function onEdit(name,field,val) {
  const c=contacts.find(c=>c.name===name);
  if(c&&c[field]!==val) c[field]=val;
}
function lockEl(id) {
  const el=document.getElementById(id);
  if(el){el.contentEditable='false';el.classList.add('locked');}
}
function unlockEl(id) {
  const el=document.getElementById(id);
  if(!el) return;
  el.contentEditable='true';el.classList.remove('locked');el.focus();
  const r=document.createRange();r.selectNodeContents(el);
  const s=window.getSelection();s.removeAllRanges();s.addRange(r);
}

// CHECKBOXES
let ckd=new Set();
function onChk(name,checked) {
  if(checked) ckd.add(name); else ckd.delete(name);
  const rid='r-'+name.replace(/[^a-z0-9]/gi,'_');
  const row=document.getElementById(rid);
  if(row) row.classList.toggle('ck',checked);
  if(!checked) lockEl('n-'+name.replace(/[^a-z0-9]/gi,'_'));
  updBar();
  const all=document.querySelectorAll('.rchk'),ca=document.getElementById('chk-all');
  if(ca){ca.checked=[...all].every(c=>c.checked);ca.indeterminate=ckd.size>0&&!ca.checked;}
}
function toggleAll(cb) {
  document.querySelectorAll('.rchk').forEach(c=>{c.checked=cb.checked;onChk(c.dataset.name,cb.checked);});
}
function updBar() {
  const bar=document.getElementById('act-bar');
  if(bar) bar.style.display=ckd.size>0?'flex':'none';
}
function editCk() {
  if(ckd.size===1) unlockEl('n-'+[...ckd][0].replace(/[^a-z0-9]/gi,'_'));
}
function saveCk() {
  ckd.forEach(name=>{
    const c=contacts.find(c=>c.name===name);
    const el=document.getElementById('n-'+name.replace(/[^a-z0-9]/gi,'_'));
    if(c&&el) c.name=el.innerText.trim();
  });
  save();
  const btn=document.getElementById('g-save');
  if(btn){btn.textContent='Saved ✓';btn.style.background='#16a34a';
    setTimeout(()=>{
      ckd.clear();
      document.querySelectorAll('.rchk').forEach(c=>c.checked=false);
      document.querySelectorAll('tr.ck').forEach(r=>r.classList.remove('ck'));
      document.querySelectorAll('[id^="n-"]').forEach(el=>lockEl(el.id));
      const ca=document.getElementById('chk-all');if(ca){ca.checked=false;ca.indeterminate=false;}
      updBar();btn.textContent='Save';btn.style.background='var(--accent2)';
    },1000);
  }
}
function delCk() {
  if(!ckd.size) return;
  if(!confirm('Delete '+ckd.size+' contact(s)?')) return;
  contacts=contacts.filter(c=>!ckd.has(c.name));
  ckd.clear();save();render();
}

// ADD
function addContact() {
  const name=(document.getElementById('a-name').value||'').trim();
  if(!name){document.getElementById('a-name').focus();return;}
  if(contacts.find(c=>c.name===name)){alert(name+' already exists');return;}
  contacts.push({
    name,
    phone:(document.getElementById('a-phone').value||'').replace(/\D/g,''),
    ext:(document.getElementById('a-ext').value||'').trim(),
    contact:(document.getElementById('a-contact').value||'').trim(),
    title:(document.getElementById('a-title').value||'').trim()
  });
  save();render();
  ['a-name','a-phone','a-ext','a-contact','a-title'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('a-name').focus();
}

// INIT
render();
fetch('/data/phonebook.json?_='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{
  serverLoaded=true;
  if(Array.isArray(d)&&d.length>=BUILTIN.length){contacts=d;render();}
}).catch(()=>{serverLoaded=true;});
</script>
</body>
</html>
