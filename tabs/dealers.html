<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dealers  Bridgestone Firestone Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9; --border:#e2e8f0;
    --accent:#e8292d; --accent2:#1e3a5f;
    --text:#0f172a; --text2:#475569; --text3:#94a3b8;
    --green:#16a34a; --amber:#d97706; --red:#dc2626;
    --font:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }

  h1, h2, h3, h4 { margin: 0; font-weight: 600; }

  /*  Page Header  */
  .page-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .page-header .logo-bar {
    background: var(--accent2);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 4px;
    letter-spacing: .5px;
  }
  .page-header h1 { font-size: 22px; color: var(--text); }
  .page-header .tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
  }
  .page-header .add-btn { margin-left: auto; }

  /*  Cards  */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--text2);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .icon { font-size: 16px; }

  /*  Buttons  */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
    text-decoration: none;
  }
  .btn:hover { background: var(--surface2); }
  .btn-primary {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #fff;
  }
  .btn-primary:hover { background: #162d4a; border-color: #162d4a; }
  .btn-accent {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-accent:hover { background: #c82226; border-color: #c8222f; }
  .btn-danger {
    background: var(--surface);
    border-color: var(--red);
    color: var(--red);
  }
  .btn-danger:hover { background: #fef2f2; }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 5px; }
  .btn-icon { padding: 6px 8px; font-size: 14px; }

  /*  Quick Quote  */
  .quote-grid {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 14px;
    align-items: end;
  }
  @media (max-width: 600px) {
    .quote-grid { grid-template-columns: 1fr; }
  }
  .quote-results {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 16px;
  }
  @media (max-width: 500px) {
    .quote-results { grid-template-columns: 1fr 1fr; }
  }
  .quote-result-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    text-align: center;
  }
  .quote-result-box .label {
    font-size: 11px;
    color: var(--text3);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .4px;
    margin-bottom: 4px;
  }
  .quote-result-box .value {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .quote-result-box.green .value { color: var(--green); }
  .quote-result-box.amber .value { color: var(--amber); }
  .quote-result-box.blue .value { color: var(--accent2); }
  .quote-result-box .sub {
    font-size: 10px;
    color: var(--text3);
    margin-top: 2px;
  }

  /*  Form Fields  */
  .form-group { margin-bottom: 14px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  input[type="text"],
  input[type="number"],
  input[type="email"],
  input[type="tel"],
  select,
  textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
    outline: none;
    transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent2); }
  textarea { resize: vertical; min-height: 70px; }

  /*  Search/Filter Bar  */
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .toolbar input[type="text"] { flex: 1; min-width: 180px; }
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text2);
    transition: all .15s;
    user-select: none;
  }
  .chip:hover { background: var(--surface2); }
  .chip.active {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #fff;
  }

  /*  Dealer Grid  */
  .dealer-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  /*  Dealer Card  */
  .dealer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    overflow: hidden;
    transition: box-shadow .2s;
  }
  .dealer-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .dealer-card-header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .dealer-avatar {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: var(--accent2);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
  }
  .dealer-name-block { flex: 1; min-width: 0; }
  .dealer-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dealer-contact {
    font-size: 12px;
    color: var(--text2);
    margin-top: 2px;
  }
  .dealer-card-body { padding: 12px 16px; }
  .dealer-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
    margin-bottom: 10px;
  }
  .meta-item { display: flex; flex-direction: column; }
  .meta-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: var(--text3);
    font-weight: 600;
    margin-bottom: 1px;
  }
  .meta-value {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }
  .meta-value a {
    color: var(--accent2);
    text-decoration: none;
  }
  .meta-value a:hover { text-decoration: underline; }
  .discount-badge {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    background: #f0fdf4;
    color: var(--green);
    border: 1px solid #bbf7d0;
    padding: 2px 8px;
    border-radius: 20px;
  }

  /*  Category Badge  */
  .cat-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cat-Body\ Shop { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .cat-Fleet { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
  .cat-Tire\ Dealer { background: #ffe4e6; color: #9f1239; border: 1px solid #fecdd3; }
  .cat-Referral\ Partner { background: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }
  .cat-Wholesale { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }

  /*  Card Actions  */
  .dealer-card-actions {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--surface2);
    flex-wrap: wrap;
  }

  /*  Notes Expand  */
  .notes-toggle {
    background: none;
    border: none;
    padding: 0;
    font-family: var(--font);
    font-size: 12px;
    color: var(--accent2);
    cursor: pointer;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .notes-toggle:hover { text-decoration: underline; }
  .notes-panel {
    padding: 10px 16px;
    background: #fffbeb;
    border-top: 1px solid #fde68a;
    font-size: 13px;
    color: var(--text2);
    display: none;
  }
  .notes-panel.open { display: block; }
  .notes-panel textarea {
    width: 100%;
    border: 1px solid #fde68a;
    background: #fff;
    border-radius: 5px;
    font-size: 12px;
    padding: 6px 8px;
    margin-top: 6px;
    resize: vertical;
    min-height: 55px;
    font-family: var(--font);
  }
  .notes-save-btn {
    margin-top: 6px;
    font-size: 11px;
    padding: 4px 10px;
  }

  /*  Empty State  */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text3);
    grid-column: 1 / -1;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /*  Modal  */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 1000;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    width: 100%;
    max-width: 560px;
    padding: 24px;
    position: relative;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .modal-header h2 { font-size: 17px; }
  .modal-close {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: var(--text3);
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .modal-close:hover { background: var(--surface2); color: var(--text); }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  /*  Preferred Contact  */
  .radio-group { display: flex; gap: 16px; flex-wrap: wrap; }
  .radio-option { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
  .radio-option input { cursor: pointer; }

  /*  Misc  */
  .count-badge {
    background: var(--accent2);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 6px;
  }
  .section-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }
  .mono { font-family: var(--mono); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

<script>
  /*  Constants  */
  const DISPATCH_URL   = 'https://n8n.646202.com/webhook/dispatch';
  const DISPATCH_TOKEN = 'a7fe255af893c3321935d0acc41f199a252e0392de13468cd31f195171baf4c8';
  const SMS_WEBHOOK    = 'https://n8n.646202.com/webhook/sms';

  const PHONEBOOK_URL  = '/data/phonebook.json';
  const TRIAGE_URL     = '/data/triage.json';
  const ARTICLES_URL   = '/data/articles.json';
  const STORAGE_KEY    = 'dealers646202';

  /*  Default Data  */
  const DEFAULT_DEALERS = [
    {name:"Webster Auto Body", contact:"Mike", phone:"5857879999", email:"", account:"WB001", discount:15, cat:"Body Shop", notes:"Good referral source. Sends 3-5 customers/month. Preferred: call before noon.", prefContact:"Phone"},
    {name:"Ridge Rd Used Cars", contact:"Tom", phone:"5851234567", email:"tom@ridgerd.com", account:"RR002", discount:20, cat:"Fleet", notes:"5 vehicles in fleet. Net 30 terms. Prefers email invoices.", prefContact:"Email"},
    {name:"Gates Tire Wholesale", contact:"Sarah Gates", phone:"5853334444", email:"sarah@gatestire.com", account:"GT003", discount:25, cat:"Tire Dealer", notes:"High volume reseller. Monthly bulk orders. Price sensitive.", prefContact:"Email"},
    {name:"Northside Body Works", contact:"Carlos", phone:"5855556677", email:"", account:"NB004", discount:12, cat:"Body Shop", notes:"Newer account. Building relationship. Good potential.", prefContact:"Phone"},
    {name:"Suburban Fleet Mgmt", contact:"Linda Park", phone:"5852223333", email:"linda@suburbanfleet.com", account:"SF005", discount:22, cat:"Fleet", notes:"20+ vehicle fleet. Municipal contract. Quarterly billing.", prefContact:"Either"},
    {name:"Monroe Parts & Supply", contact:"Dave Monroe", phone:"5858889900", email:"dave@monroesupply.com", account:"MP006", discount:18, cat:"Wholesale", notes:"Wholesale distributor. FOB terms. Reliable payer.", prefContact:"Email"}
  ];

  /*  State  */
  let dealers = [];
  let activeFilter = 'All';
  const categories = ['All','Tire Dealer','Body Shop','Fleet','Referral Partner','Wholesale'];

  /*  Load/Save  */
  function loadDealers() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        dealers = JSON.parse(raw);
      } else {
        dealers = JSON.parse(JSON.stringify(DEFAULT_DEALERS));
        saveDealers();
      }
    } catch(e) {
      dealers = JSON.parse(JSON.stringify(DEFAULT_DEALERS));
    }
  }

  function saveDealers() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(dealers));
  }

  /*  Filter Chips  */
  function buildChips() {
    const el = document.getElementById('filterChips');
    el.innerHTML = categories.map(c =>
      `<span class="chip ${c === activeFilter ? 'active' : ''}" onclick="setFilter('${c}')">${c}</span>`
    ).join('');
  }

  function setFilter(cat) {
    activeFilter = cat;
    buildChips();
    renderDealers();
  }

  /*  Initials  */
  function initials(name) {
    return name.split(' ').slice(0,2).map(w => w[0]||'').join('').toUpperCase();
  }

  /*  Category Badge  */
  function catBadge(cat) {
    return `<span class="cat-badge cat-${cat.replace(/ /g,'\ ')}">${cat}</span>`;
  }

  /*  Format Phone  */
  function fmtPhone(p) {
    const d = (p||'').replace(/\D/g,'');
    if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
    if (d.length === 11 && d[0]==='1') return `+1 (${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
    return p;
  }

  /*  Render  */
  function renderDealers() {
    const grid = document.getElementById('dealerGrid');
    const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();

    let list = dealers.filter((d, i) => {
