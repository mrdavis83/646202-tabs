<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Articles — Store 646202</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f8fafc; --surface:#fff; --surface2:#f1f5f9; --border:#e2e8f0;
  --accent2:#1e3a5f; --text:#0f172a; --text2:#475569; --text3:#94a3b8;
  --font:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--text); padding:16px; font-size:14px; }

/* ADD FORM */
.add-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.add-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text2); margin-bottom:8px; }
.add-row { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
.field { display:flex; flex-direction:column; gap:3px; }
.field label { font-size:11px; font-weight:600; color:var(--text2); }
.fi { font-family:var(--font); font-size:13px; border:1px solid var(--border); border-radius:6px; padding:6px 9px; outline:none; background:var(--surface); color:var(--text); }
.fi:focus { border-color:var(--accent2); }

/* TOOLBAR */
.toolbar { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
.toolbar .fi { flex:1; min-width:160px; }
.count { font-size:12px; color:var(--text3); margin-left:auto; white-space:nowrap; }

/* BUTTONS */
.btn { display:inline-flex; align-items:center; padding:5px 11px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--text); font-family:var(--font); font-size:12px; font-weight:500; cursor:pointer; white-space:nowrap; }
.btn:hover { background:var(--surface2); }
.btn-primary { background:var(--accent2); color:#fff; border-color:var(--accent2); }
.btn-primary:hover { background:#162d4a; }
.btn-edit { background:#f0fdf4; color:#15803d; border-color:#86efac; }
.btn-save { background:var(--accent2); color:#fff; border-color:var(--accent2); }
.btn-del { border-color:#fca5a5; color:#dc2626; }
.btn-del:hover { background:#fef2f2; }

/* TABLE — key: display:inline-block so it shrinks to content */
.table-wrap { display:inline-block; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.05); overflow:hidden; vertical-align:top; }
table { width:auto; border-collapse:collapse; }
thead { background:var(--surface2); }
th { padding:7px 10px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); border-bottom:1px solid var(--border); white-space:nowrap; user-select:none; }
th.s { cursor:pointer; }
th.s:hover { color:var(--text2); background:#e8edf2; }
th.sa { color:var(--accent2); }
th.sa .si { opacity:1; color:var(--accent2); }
.si { margin-left:2px; opacity:.4; font-size:9px; }
td { padding:6px 10px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; white-space:nowrap; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:#fafbfc; }
tr.ck td { background:#eff6ff; }

/* CATEGORY BADGE / SELECT */
.cat-sel { font-family:var(--font); font-size:11px; font-weight:700; border:1px solid transparent; border-radius:4px; padding:2px 5px; cursor:pointer; outline:none; }
.cat-sel:hover { border-color:var(--border); }
.cat-sel:focus { border-color:var(--accent2); }
.c-labor { background:#fef9c3; color:#854d0e; }
.c-parts { background:#dbeafe; color:#1d4ed8; }
.c-tire  { background:#f3e8ff; color:#6b21a8; }
.c-oil   { background:#dcfce7; color:#15803d; }
.c-misc  { background:#f1f5f9; color:#475569; }
.c-discount { background:#fee2e2; color:#b91c1c; }
.c-other { background:#f0f4ff; color:#3730a3; }

/* INLINE EDITABLE */
.ed { display:block; padding:2px 4px; border-radius:4px; border:1px solid transparent; outline:none; }
.ed:hover { border-color:var(--border); background:var(--surface2); cursor:text; }
.ed:focus { border-color:var(--accent2); background:var(--surface); }
.ed.locked { cursor:default !important; }
.ed.locked:hover { border-color:transparent !important; background:transparent !important; }

/* ACTION BAR in thead */
.act-bar { display:none; gap:4px; align-items:center; }

/* CATEGORY DROPDOWN */
.cd-wrap { position:relative; }
.cd-menu { display:none; position:absolute; top:100%; left:0; min-width:150px; background:var(--surface); border:1px solid var(--border); border-radius:6px; box-shadow:0 4px 12px rgba(0,0,0,.1); z-index:200; }
.cd-item { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; cursor:pointer; font-size:13px; }
.cd-item:hover { background:var(--surface2); }
.cd-rm { background:none; border:none; color:var(--text3); cursor:pointer; font-size:13px; padding:0 2px; }
.cd-rm:hover { color:#dc2626; }
.cd-footer { padding:6px 8px; border-top:1px solid var(--border); display:flex; gap:5px; }
.cd-new { flex:1; font-family:var(--font); font-size:12px; border:1px solid var(--border); border-radius:4px; padding:4px 7px; outline:none; }
.cd-new:focus { border-color:var(--accent2); }

input[type=checkbox] { cursor:pointer; width:14px; height:14px; accent-color:var(--accent2); }
</style>
</head>
<body><a href="https://646202.com/cdn-cgi/content?id=hfaS5EKSO1Amzei_DqqkQ7W1lQ7WZU94Na.Bq2VySxM-1780884720.3732224-1.2.1.1-_G697kkzgk8_YaXEWLv8zvKSm4qCIb1wMXNR07hYD6I" aria-hidden="true" rel="nofollow noopener" style="display: none !important; visibility: hidden !important"></a>

<!-- ADD FORM -->
<div class="add-card">
  <div class="add-title">Add Article Number</div>
  <div class="add-row">
    <div class="field"><label>Article #</label>
      <input class="fi" id="a-num" style="width:100px;font-family:var(--mono)" placeholder="7004578">
    </div>
    <div class="field"><label>Price</label>
      <input class="fi" id="a-price" style="width:85px" placeholder="0.00">
    </div>
    <div class="field"><label>Category</label>
      <div class="cd-wrap">
        <input class="fi" id="a-cat" style="width:115px;cursor:pointer" placeholder="Category..." readonly onclick="toggleCatDrop()">
        <div class="cd-menu" id="cat-menu">
          <div id="cat-list"></div>
          <div class="cd-footer">
            <input class="cd-new" id="cat-new" placeholder="New category..." onkeydown="if(event.key==='Enter')addCat()">
            <button class="btn btn-primary" style="padding:4px 8px;font-size:11px" onclick="addCat()">+ Add</button>
          </div>
        </div>
      </div>
    </div>
    <div class="field" style="flex:1;min-width:200px"><label>Description</label>
      <input class="fi" id="a-desc" placeholder="Description">
    </div>
    <div class="field"><label>Notes</label>
      <input class="fi" id="a-notes" style="width:140px" placeholder="Optional">
    </div>
    <div class="field"><label>&nbsp;</label>
      <button class="btn btn-primary" onclick="addArticle()">+ Add</button>
    </div>
  </div>
</div>

<!-- TOOLBAR -->
<div style="display:inline-block;vertical-align:top;min-width:0">
<div class="toolbar" style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:nowrap">
  <input class="fi" id="srch" placeholder="🔍 Search article numbers..." oninput="render()" style="width:200px;flex:none">
  <select class="fi" id="cat-filter" onchange="render()" style="width:130px">
    <option value="all">All Categories</option>
  </select>
  <button class="btn" onclick="exportCSV()" style="font-size:12px">I CSV</button>
  <span class="count" id="art-count"></span>
</div>

<!-- TABLE -->
<div class="table-wrap">
<table>
  <thead><tr>
    <th style="width:28px;text-align:center;padding:6px 4px">
      <input type="checkbox" id="chk-all" onclick="toggleAll(this)">
    </th>
    <th class="s" onclick="sortBy('num')" id="th-num">Article # <span class="si" id="si-num"></span></th>
    <th class="s" onclick="sortBy('price')" id="th-price" style="text-align:center">Price <span class="si" id="si-price"></span></th>
    <th class="s" onclick="sortBy('cat')" id="th-cat" style="text-align:center">Category <span class="si" id="si-cat"></span></th>
    <th class="s" onclick="sortBy('desc')" id="th-desc">Description <span class="si" id="si-desc"></span></th>
    <th class="s" onclick="sortBy('notes')" id="th-notes">Notes <span class="si" id="si-notes"></span></th>
    <th style="padding:5px 8px">
      <div class="act-bar" id="act-bar">
        <button class="btn btn-edit" style="padding:3px 9px;font-size:11px" onclick="editCk()">Edit</button>
        <button class="btn btn-save" style="padding:3px 9px;font-size:11px" id="g-save" onclick="saveCk()">Save</button>
        <button class="btn btn-del" style="padding:3px 9px;font-size:11px" onclick="delCk()">Del</button>
      </div>
    </th>
  </tr></thead>
  <tbody id="art-body"></tbody>
</table>
</div>
</div>

<script>
// DATA
const BUILTIN = [{"num": "7004578", "cat": "labor", "desc": "Alignments (1 time)", "price": "", "notes": ""}, {"num": "7005229", "cat": "labor", "desc": "(LTA) Lifetime Wheel Alignment", "price": "", "notes": ""}, {"num": "7015515", "cat": "misc", "desc": "STEERING ANGLE reset (SAS) $20", "price": "$20.00", "notes": ""}, {"num": "7034294", "cat": "misc", "desc": "Steering Angle reset (SAS) $0", "price": "No Charge", "notes": ""}, {"num": "7097782", "cat": "misc", "desc": "Road Hazaqrd Protection", "price": "", "notes": ""}, {"num": "7016233", "cat": "parts", "desc": "Adjust & clean brakes", "price": "", "notes": ""}, {"num": "7006472", "cat": "labor", "desc": "Low profile labor", "price": "", "notes": ""}, {"num": "7030260", "cat": "parts", "desc": "Misc: Brake Parts", "price": "", "notes": ""}, {"num": "7041556", "cat": "labor", "desc": "Misc: Brake Labor", "price": "", "notes": ""}, {"num": "7000711", "cat": "parts", "desc": "Misc: Nuts Bolts Fasteners", "price": "", "notes": ""}, {"num": "7040231", "cat": "misc", "desc": "Sale Tax Credit", "price": "", "notes": ""}, {"num": "7003002", "cat": "parts", "desc": "Fuel System parts", "price": "", "notes": ""}, {"num": "7003030", "cat": "parts", "desc": "Engine system parts", "price": "", "notes": ""}, {"num": "7003051", "cat": "parts", "desc": "Charging system parts", "price": "", "notes": ""}, {"num": "7003081", "cat": "parts", "desc": "Starting system parts", "price": "", "notes": ""}, {"num": "7003106", "cat": "parts", "desc": "Steering system parts", "price": "", "notes": ""}, {"num": "7003130", "cat": "parts", "desc": "Wiper parts", "price": "", "notes": ""}, {"num": "7003161", "cat": "parts", "desc": "Drive train parts", "price": "", "notes": ""}, {"num": "7003219", "cat": "labor", "desc": "Fuel System labor", "price": "", "notes": ""}, {"num": "cxz001392", "cat": "labor", "desc": "Fuel System labor (alt)", "price": "", "notes": ""}, {"num": "7003240", "cat": "parts", "desc": "Engine system parts", "price": "", "notes": ""}, {"num": "7003281", "cat": "labor", "desc": "Emission system labor", "price": "", "notes": ""}, {"num": "7003303", "cat": "parts", "desc": "Steering system parts", "price": "", "notes": ""}, {"num": "7003317", "cat": "parts", "desc": "Wiper parts", "price": "", "notes": ""}, {"num": "7003348", "cat": "labor", "desc": "Accessories labor", "price": "", "notes": ""}, {"num": "7003362", "cat": "parts", "desc": "Drive train parts", "price": "", "notes": ""}, {"num": "7003386", "cat": "parts", "desc": "Starting system parts", "price": "", "notes": ""}, {"num": "7018651", "cat": "labor", "desc": "Under hood labor", "price": "", "notes": ""}];
let articles = BUILTIN.slice();
let serverLoaded = false;

// CATEGORIES
const DEF_CATS = ['labor','parts','tire','oil','misc','discount'];
let cats = DEF_CATS.slice();
function loadCats() { try { const s=JSON.parse(localStorage.getItem('artCats646202')||'null'); if(Array.isArray(s)&&s.length) cats=s; } catch(e) {} }
function saveCats() { try { localStorage.setItem('artCats646202',JSON.stringify(cats)); } catch(e) {} }
function cap(s) { return s ? s.charAt(0).toUpperCase()+s.slice(1) : ''; }
function catCls(c) { const m={labor:'c-labor',parts:'c-parts',tire:'c-tire',oil:'c-oil',misc:'c-misc',discount:'c-discount'}; return m[c]||'c-other'; }

function rebuildFilter() {
  const sel=document.getElementById('cat-filter'), cur=sel.value;
  sel.innerHTML='<option value="all">All Categories</option>'+cats.map(c=>`<option value="${c}"${c===cur?' selected':''}>${cap(c)}</option>`).join('');
}

function buildCatList() {
  const el=document.getElementById('cat-list');
  if(!el) return;
  el.innerHTML=cats.map(c=>`<div class="cd-item" onclick="selCat('${c}')"><span>${cap(c)}</span><button class="cd-rm" onclick="event.stopPropagation();rmCat('${c}')" title="Remove">✕</button></div>`).join('');
}

function toggleCatDrop() {
  const m=document.getElementById('cat-menu');
  const open=m.style.display==='block';
  m.style.display=open?'none':'block';
  if(!open) buildCatList();
}
function selCat(c) { document.getElementById('a-cat').value=c; document.getElementById('cat-menu').style.display='none'; }
function addCat() {
  const inp=document.getElementById('cat-new');
  const v=inp.value.trim().toLowerCase().replace(/\s+/g,'_');
  if(!v) return;
  if(!cats.includes(v)) { cats.push(v); saveCats(); }
  selCat(v); rebuildFilter(); inp.value='';
}
function rmCat(c) {
  if(!confirm('Remove "'+c+'"?')) return;
  cats=cats.filter(x=>x!==c); saveCats(); rebuildFilter(); buildCatList(); render();
}
document.addEventListener('click',e=>{ if(!document.querySelector('.cd-wrap').contains(e.target)) document.getElementById('cat-menu').style.display='none'; });

// SORT
let sField=null, sDir=1;
function sortBy(f) {
  if(sField===f) sDir*=-1; else {sField=f; sDir=1;}
  document.querySelectorAll('th[id^="th-"]').forEach(t=>t.classList.remove('sa'));
  document.querySelectorAll('.si').forEach(s=>s.textContent='');
  const th=document.getElementById('th-'+f), si=document.getElementById('si-'+f);
  if(th) th.classList.add('sa');
  if(si) si.textContent=sDir===1?'▲':'▼';
  render();
}
function sorted(arr) {
  if(!sField) return arr;
  return [...arr].sort((a,b)=>{
    const av=(a[sField]||'').toLowerCase(), bv=(b[sField]||'').toLowerCase();
    return av<bv?-sDir:av>bv?sDir:0;
  });
}

// SAVE
function save() {
  try { localStorage.setItem('articles646202',JSON.stringify(articles)); } catch(e) {}
  if(!serverLoaded) return;
  fetch('/data/articles.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(articles)}).catch(()=>{});
}

// RENDER
function render() {
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const cf=document.getElementById('cat-filter').value;
  const filtered=sorted(articles.filter(a=>
    (cf==='all'||a.cat===cf) &&
    (!q||(a.num+' '+a.desc+' '+(a.notes||'')).toLowerCase().includes(q))
  ));
  document.getElementById('art-count').textContent=filtered.length+' of '+articles.length+' articles';
  const tbody=document.getElementById('art-body');
  if(!filtered.length) {
    tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text3)">No articles match</td></tr>';
    return;
  }
  tbody.innerHTML=filtered.map(a=>{
    const opts=cats.map(c=>`<option value="${c}"${a.cat===c?' selected':''}>${cap(c)}</option>`).join('');
    const cc=catCls(a.cat||'misc');
    const isChk=ckd.has(a.num);
    return `<tr id="r-${a.num}"${isChk?' class="ck"':''}>
      <td style="text-align:center;padding:6px 4px">
        <input type="checkbox" class="rchk" data-num="${a.num}" onchange="onChk('${a.num}',this.checked)"${isChk?' checked':''}>
      </td>
      <td style="font-family:var(--mono);font-weight:700">${a.num}</td>
      <td style="text-align:center;font-family:var(--mono)">
        <span class="ed" contenteditable="true" spellcheck="false"
          onblur="onEdit('${a.num}','price',this.innerText.trim())"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
          style="min-width:60px"
        >${a.price||''}</span>
      </td>
      <td style="text-align:center">
        <select class="cat-sel ${cc}" onchange="onEdit('${a.num}','cat',this.value);applyCS(this)" onfocus="this.style.borderColor='var(--accent2)'" onblur="this.style.borderColor='transparent'">${opts}</select>
      </td>
      <td>
        <span class="ed locked" id="d-${a.num}" contenteditable="false" spellcheck="false"
          onblur="onEdit('${a.num}','desc',this.innerText.trim());lockD('${a.num}')"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
          style="min-width:160px"
        >${a.desc||''}</span>
      </td>
      <td>
        <span class="ed" contenteditable="true" spellcheck="false"
          onblur="onEdit('${a.num}','notes',this.innerText.trim())"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
          style="color:var(--text3);font-size:12px;min-width:80px"
        >${a.notes||''}</span>
      </td>
      <td style="padding:6px 8px"></td>
    </tr>`;
  }).join('');
  document.querySelectorAll('.cat-sel').forEach(applyCS);
}

function applyCS(sel) {
  const st={labor:['#fef9c3','#854d0e'],parts:['#dbeafe','#1d4ed8'],tire:['#f3e8ff','#6b21a8'],oil:['#dcfce7','#15803d'],misc:['#f1f5f9','#475569'],discount:['#fee2e2','#b91c1c']};
  const s=st[sel.value]||['#f0f4ff','#3730a3'];
  sel.style.background=s[0]; sel.style.color=s[1]; sel.style.borderColor='transparent';
}

function onEdit(num,field,val) {
  const a=articles.find(a=>a.num===num);
  if(a&&a[field]!==val) a[field]=val;
}
function lockD(num) { const el=document.getElementById('d-'+num); if(el){el.contentEditable='false';el.classList.add('locked');} }
function unlockD(num) {
  const el=document.getElementById('d-'+num);
  if(!el) return;
  el.contentEditable='true'; el.classList.remove('locked'); el.focus();
  const r=document.createRange(); r.selectNodeContents(el);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}

// CHECKBOXES
let ckd=new Set();
function onChk(num,checked) {
  if(checked) ckd.add(num); else ckd.delete(num);
  const row=document.getElementById('r-'+num);
  if(row) row.classList.toggle('ck',checked);
  if(!checked) lockD(num);
  updBar();
  const all=document.querySelectorAll('.rchk'), ca=document.getElementById('chk-all');
  if(ca){ ca.checked=[...all].every(c=>c.checked); ca.indeterminate=ckd.size>0&&!ca.checked; }
}
function toggleAll(cb) {
  document.querySelectorAll('.rchk').forEach(c=>{ c.checked=cb.checked; onChk(c.dataset.num,cb.checked); });
}
function updBar() {
  const bar=document.getElementById('act-bar');
  if(bar) bar.style.display=ckd.size>0?'flex':'none';
}
function editCk() { if(ckd.size===1) unlockD([...ckd][0]); }
function saveCk() {
  ckd.forEach(num=>{
    const a=articles.find(a=>a.num===num);
    const el=document.getElementById('d-'+num);
    if(a&&el) a.desc=el.innerText.trim();
  });
  save();
  const btn=document.getElementById('g-save');
  if(btn){ btn.textContent='Saved ✓'; btn.style.background='#16a34a';
    setTimeout(()=>{
      ckd.clear();
      document.querySelectorAll('.rchk').forEach(c=>c.checked=false);
      document.querySelectorAll('tr.ck').forEach(r=>r.classList.remove('ck'));
      document.querySelectorAll('[id^="d-"]').forEach(el=>lockD(el.id.slice(2)));
      const ca=document.getElementById('chk-all'); if(ca){ca.checked=false;ca.indeterminate=false;}
      updBar(); btn.textContent='Save'; btn.style.background='var(--accent2)';
    },1000);
  }
}
function delCk() {
  if(!ckd.size) return;
  if(!confirm('Delete '+ckd.size+' article(s)?')) return;
  articles=articles.filter(a=>!ckd.has(a.num));
  ckd.clear(); save(); render();
}

// ADD
function addArticle() {
  const num=(document.getElementById('a-num').value||'').trim();
  if(!num){ document.getElementById('a-num').focus(); return; }
  if(articles.find(a=>a.num===num)){ alert('Article # '+num+' already exists'); return; }
  articles.push({
    num,
    price:(document.getElementById('a-price').value||'').trim(),
    cat:(document.getElementById('a-cat').value||'misc').toLowerCase().trim(),
    desc:(document.getElementById('a-desc').value||'').trim(),
    notes:(document.getElementById('a-notes').value||'').trim()
  });
  save(); render();
  ['a-num','a-price','a-cat','a-desc','a-notes'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('a-num').focus();
}

// EXPORT
function exportCSV() {
  const rows=[['Article #','Price','Category','Description','Notes']];
  articles.forEach(a=>rows.push([a.num,a.price,a.cat,a.desc,a.notes]));
  const csv=rows.map(r=>r.map(v=>'"'+(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const el=document.createElement('a'); el.href='data:text/csv,'+encodeURIComponent(csv); el.download='articles_646202.csv'; el.click();
}

// INIT
loadCats(); rebuildFilter(); render();
fetch('/data/articles.json?_='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{
  serverLoaded=true;
  if(Array.isArray(d)&&d.length>=BUILTIN.length){ articles=d; render(); }
}).catch(()=>{serverLoaded=true;});
</script>
</body>
</html>
