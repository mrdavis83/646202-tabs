<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar — Store 646202</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--border:#e2e8f0;--accent:#e8292d;--navy:#1e3a5f;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--green:#16a34a;--amber:#d97706;--red:#dc2626;--font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);padding:20px;font-size:14px}

.layout{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
@media(max-width:800px){.layout{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:14px;overflow:hidden}
.card-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text2)}
.card-body{padding:16px}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-primary:hover{opacity:.88}
.btn-danger{color:var(--red);border-color:#fca5a5}
.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:4px 10px;font-size:11px}

/* Calendar grid */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-month{font-size:16px;font-weight:700;color:var(--navy)}
.cal-nav-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:14px;color:var(--text2)}
.cal-nav-btn:hover{background:var(--surface2)}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:6px 0}
.cal-day{min-height:52px;padding:4px;border-radius:6px;cursor:pointer;position:relative;border:1px solid transparent;transition:all .15s}
.cal-day:hover{background:var(--surface2);border-color:var(--border)}
.cal-day.today{background:#eff6ff;border-color:#bfdbfe}
.cal-day.today .day-num{color:var(--navy);font-weight:700}
.cal-day.selected{background:var(--navy);border-color:var(--navy)}
.cal-day.selected .day-num{color:#fff}
.cal-day.other-month{opacity:.35}
.cal-day.has-reminder .day-num::after{content:'';display:block;width:5px;height:5px;background:var(--accent);border-radius:50%;margin:1px auto 0}
.day-num{font-size:12px;font-weight:500;text-align:center;line-height:1.2}
.day-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;justify-content:center}
.day-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}

/* Add reminder form */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.form-label{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:3px}
.form-input{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-family:var(--font);font-size:13px;outline:none;background:var(--surface);color:var(--text)}
.form-input:focus{border-color:var(--navy)}
.form-row-full{margin-bottom:8px}

/* Reminder list */
.reminder-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);transition:background .1s}
.reminder-item:last-child{border-bottom:none}
.reminder-item:hover{background:var(--surface2)}
.reminder-item.fired{opacity:.5}
.ri-time-badge{flex-shrink:0;font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;white-space:nowrap}
.ri-upcoming{background:#eff6ff;color:#1e40af}
.ri-soon{background:#fef3c7;color:#92400e}
.ri-past{background:var(--surface2);color:var(--text3)}
.ri-info{flex:1;min-width:0}
.ri-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-sub{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:1px}
.ri-sms{font-size:10px;color:var(--green);font-weight:600;margin-top:2px}

/* Alert banner */
#alertBanner{display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--navy);color:#fff;padding:14px 24px;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.25);font-size:14px;font-weight:600;max-width:360px;text-align:center;animation:popIn .3s ease}
@keyframes popIn{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#alertBanner .alert-close{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:6px;cursor:pointer}
#alertBanner .alert-title{font-size:16px;margin-bottom:4px}

/* Toast */
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:6px;z-index:9998;pointer-events:none}
.toast{padding:9px 16px;border-radius:7px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.18);animation:tin .2s ease}
@keyframes tin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.t-ok{background:var(--green)}
.t-err{background:var(--red)}
.t-info{background:var(--navy)}

.empty-msg{text-align:center;padding:28px 16px;color:var(--text3);font-size:13px}
.sms-toggle{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:13px}
.sms-toggle input[type=checkbox]{width:16px;height:16px;accent-color:var(--navy);cursor:pointer}
</style>
</head>
<body>

<!-- Alert banner (fires when reminder triggers) -->
<div id="alertBanner">
  <div class="alert-title" id="alertTitle"></div>
  <div id="alertBody"></div>
  <span class="alert-close" onclick="dismissAlert()">Tap to dismiss</span>
</div>

<div class="layout">

  <!-- LEFT: calendar + add form -->
  <div>

    <!-- Calendar -->
    <div class="card">
      <div class="card-hd">
        <span class="card-title">Calendar</span>
        <button class="btn btn-sm" onclick="goToday()">Today</button>
      </div>
      <div class="card-body" style="padding-bottom:12px">
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="prevMonth()">&#8592;</button>
          <div class="cal-month" id="calMonth"></div>
          <button class="cal-nav-btn" onclick="nextMonth()">&#8594;</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>

    <!-- Add reminder -->
    <div class="card">
      <div class="card-hd">
        <span class="card-title" id="formTitle">Add Reminder</span>
      </div>
      <div class="card-body">
        <div class="form-row-full">
          <label class="form-label">Title</label>
          <input class="form-input" id="rTitle" placeholder="e.g. Inventory count, Staff meeting...">
        </div>
        <div class="form-row">
          <div>
            <label class="form-label">Date</label>
            <input class="form-input" type="date" id="rDate">
          </div>
          <div>
            <label class="form-label">Time</label>
            <input class="form-input" type="time" id="rTime">
          </div>
        </div>
        <div class="form-row-full">
          <label class="form-label">Note (optional)</label>
          <input class="form-input" id="rNote" placeholder="Additional details...">
        </div>
        <div class="sms-toggle">
          <input type="checkbox" id="rSms">
          <label for="rSms" style="cursor:pointer">Also send SMS alert to <strong>+1 (585) 257-2886</strong></label>
        </div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn btn-primary" onclick="saveReminder()">Save Reminder</button>
          <button class="btn" id="cancelEdit" style="display:none" onclick="cancelEdit()">Cancel</button>
        </div>
      </div>
    </div>

  </div>

  <!-- RIGHT: upcoming + all reminders -->
  <div>

    <!-- Upcoming -->
    <div class="card">
      <div class="card-hd">
        <span class="card-title">Upcoming</span>
        <span id="upcomingCount" style="font-size:11px;font-family:var(--mono);color:var(--text3)"></span>
      </div>
      <div id="upcomingList">
        <div class="empty-msg">No upcoming reminders</div>
      </div>
    </div>

    <!-- Selected day -->
    <div class="card" id="dayCard" style="display:none">
      <div class="card-hd">
        <span class="card-title" id="dayCardTitle">Selected Day</span>
      </div>
      <div id="dayList"></div>
    </div>

    <!-- All reminders -->
    <div class="card">
      <div class="card-hd">
        <span class="card-title">All Reminders</span>
        <button class="btn btn-sm btn-danger" onclick="clearPast()">Clear Past</button>
      </div>
      <div id="allList">
        <div class="empty-msg">No reminders yet</div>
      </div>
    </div>

  </div>
</div>

<div id="toasts"></div>

<script>
'use strict';

const KEY  = 'cal_reminders_646202';
const TWILIO_FROM = '+18444358626';
const TWILIO_TO   = '+15852572886';

let reminders  = [];
let viewYear   = new Date().getFullYear();
let viewMonth  = new Date().getMonth();
let selectedDay = null;
let editingId   = null;
let alerted     = new Set();

// ── Storage ───────────────────────────────────────
function load() {
  try { reminders = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { reminders = []; }
  try { alerted = new Set(JSON.parse(localStorage.getItem(KEY + '_alerted') || '[]')); } catch { alerted = new Set(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(reminders)); } catch {}
}
function saveAlerted() {
  try { localStorage.setItem(KEY + '_alerted', JSON.stringify([...alerted])); } catch {}
}

// ── Toast ─────────────────────────────────────────
function toast(msg, cls='t-info', ms=2800) {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + cls; t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.cssText='opacity:0;transition:opacity .3s'; setTimeout(()=>t.remove(),350); }, ms);
}

// ── Chime (Web Audio API) ─────────────────────────
function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
    notes.forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      const start = ctx.currentTime + i * 0.22;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.35, start + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.55);
      osc.start(start); osc.stop(start + 0.6);
    });
  } catch(e) {}
}

// ── Alert banner ──────────────────────────────────
function showAlert(r) {
  chime();
  const dt = new Date(r.ts);
  const timeStr = dt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:true});
  document.getElementById('alertTitle').textContent = '🔔 ' + r.title;
  document.getElementById('alertBody').textContent = (r.note ? r.note + ' · ' : '') + timeStr;
  const b = document.getElementById('alertBanner');
  b.style.display = 'block';
  // Auto-dismiss after 30 seconds
  setTimeout(dismissAlert, 30000);
}
function dismissAlert() {
  document.getElementById('alertBanner').style.display = 'none';
}

// ── SMS via Dispatch ──────────────────────────────
async function sendSMS(r) {
  const dt = new Date(r.ts);
  const timeStr = dt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:true});
  const msg = encodeURIComponent(`\u{1F514} Reminder: ${r.title}${r.note ? ' - ' + r.note : ''} (${timeStr})`);
  try {
    const cmd = `curl -s -X POST https://n8n.646202.com/webhook/dispatch -H "X-Dispatch-Token: a7fe255af893c3321935d0acc41f199a252e0392de13468cd31f195171baf4c8" -H "Content-Type: application/json" -d '{"command":"curl -s -X POST https://api.twilio.com/2010-04-01/Accounts/$(grep TWILIO_ACCOUNT /etc/environment | cut -d= -f2)/Messages.json --user \\"$TWILIO_ACCOUNT:$TWILIO_AUTH\\" -d \\"To=${TWILIO_TO}&From=${TWILIO_FROM}&Body=${msg}\\""}'`;
    // Simpler: use the SMS webhook directly if available
    await fetch('https://n8n.646202.com/webhook/sms', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        to: TWILIO_TO,
        from: TWILIO_FROM,
        body: `\u{1F514} Reminder: ${r.title}${r.note ? ' - ' + r.note : ''} (${timeStr})`
      })
    });
  } catch(e) {}
}

// ── Reminder checker (every 30s) ──────────────────
function checkReminders() {
  const now = Date.now();
  reminders.forEach(r => {
    if (alerted.has(r.id)) return;
    const diff = r.ts - now;
    if (diff <= 0 && diff > -120000) { // within last 2 mins
      alerted.add(r.id);
      saveAlerted();
      showAlert(r);
      if (r.sms) sendSMS(r);
      renderAll();
    }
  });
}

// ── Calendar ──────────────────────────────────────
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function renderCalendar() {
  document.getElementById('calMonth').textContent = MONTHS[viewMonth] + ' ' + viewYear;
  const grid = document.getElementById('calGrid');

  // Day-of-week headers
  let html = DAYS.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const first = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrev  = new Date(viewYear, viewMonth, 0).getDate();
  const today = new Date();
  const todayKey = dateKey(today);

  // Build set of days with reminders this month
  const reminderDays = {};
  reminders.forEach(r => {
    const d = new Date(r.ts);
    if (d.getFullYear() === viewYear && d.getMonth() === viewMonth) {
      const day = d.getDate();
      if (!reminderDays[day]) reminderDays[day] = [];
      reminderDays[day].push(r);
    }
  });

  // Prev month fill
  for (let i = first - 1; i >= 0; i--) {
    html += `<div class="cal-day other-month"><div class="day-num">${daysInPrev - i}</div></div>`;
  }

  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const key = viewYear + '-' + String(viewMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const isToday    = key === todayKey;
    const isSelected = selectedDay === key;
    const hasR       = reminderDays[d];
    let cls = 'cal-day';
    if (isToday)    cls += ' today';
    if (isSelected) cls += ' selected';
    if (hasR)       cls += ' has-reminder';

    let dots = '';
    if (hasR) {
      dots = '<div class="day-dots">' + hasR.slice(0,3).map(r => {
        const color = alerted.has(r.id) ? 'var(--text3)' : 'var(--accent)';
        return `<div class="day-dot" style="background:${color}"></div>`;
      }).join('') + '</div>';
    }

    html += `<div class="${cls}" onclick="selectDay('${key}')"><div class="day-num">${d}</div>${dots}</div>`;
  }

  // Next month fill
  const total = first + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-day other-month"><div class="day-num">${i}</div></div>`;
  }

  grid.innerHTML = html;
}

function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function selectDay(key) {
  selectedDay = key;
  // Pre-fill date in form
  document.getElementById('rDate').value = key;
  renderCalendar();
  renderDayCard(key);
}

function renderDayCard(key) {
  const [y,m,d] = key.split('-').map(Number);
  const dayReminders = reminders.filter(r => {
    const rd = new Date(r.ts);
    return rd.getFullYear()===y && rd.getMonth()+1===m && rd.getDate()===d;
  }).sort((a,b)=>a.ts-b.ts);

  const card = document.getElementById('dayCard');
  const title = document.getElementById('dayCardTitle');
  title.textContent = new Date(y, m-1, d).toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});

  if (!dayReminders.length) {
    card.style.display = 'none';
    return;
  }
  card.style.display = '';
  document.getElementById('dayList').innerHTML = dayReminders.map(r => reminderHTML(r)).join('');
}

function prevMonth() { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } renderCalendar(); }
function nextMonth() { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } renderCalendar(); }
function goToday()   { viewYear = new Date().getFullYear(); viewMonth = new Date().getMonth(); renderCalendar(); }

// ── Reminder rendering ────────────────────────────
function timeLabel(r) {
  const now = Date.now();
  const diff = r.ts - now;
  if (alerted.has(r.id)) return ['ri-past', 'Past'];
  if (diff < 0) return ['ri-past', 'Past'];
  if (diff < 3600000) return ['ri-soon', 'Soon'];
  return ['ri-upcoming', new Date(r.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:true})];
}

function reminderHTML(r) {
  const [cls, lbl] = timeLabel(r);
  const dt = new Date(r.ts);
  const dateLbl = dt.toLocaleDateString([],{month:'short',day:'numeric'});
  return `<div class="reminder-item${alerted.has(r.id)?' fired':''}">
    <span class="ri-time-badge ${cls}">${lbl}</span>
    <div class="ri-info">
      <div class="ri-title">${esc(r.title)}</div>
      <div class="ri-sub">${dateLbl} · ${dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:true})}${r.note?' · '+esc(r.note):''}</div>
      ${r.sms?'<div class="ri-sms">&#x1F4F1; SMS</div>':''}
    </div>
    <div style="display:flex;gap:4px;flex-shrink:0">
      <button class="btn btn-sm" onclick="editReminder('${r.id}')">Edit</button>
      <button class="btn btn-sm btn-danger" onclick="deleteReminder('${r.id}')">Del</button>
    </div>
  </div>`;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderAll() {
  const now = Date.now();
  const sorted = [...reminders].sort((a,b)=>a.ts-b.ts);

  // Upcoming (next 7 days)
  const upcoming = sorted.filter(r => r.ts > now && r.ts < now + 7*86400000);
  const upEl = document.getElementById('upcomingList');
  document.getElementById('upcomingCount').textContent = upcoming.length ? upcoming.length + ' this week' : '';
  upEl.innerHTML = upcoming.length
    ? upcoming.map(r => reminderHTML(r)).join('')
    : '<div class="empty-msg">No reminders this week</div>';

  // All
  const allEl = document.getElementById('allList');
  allEl.innerHTML = sorted.length
    ? sorted.map(r => reminderHTML(r)).join('')
    : '<div class="empty-msg">No reminders yet</div>';

  // Day card refresh
  if (selectedDay) renderDayCard(selectedDay);
  renderCalendar();
}

// ── CRUD ──────────────────────────────────────────
function saveReminder() {
  const title = document.getElementById('rTitle').value.trim();
  const date  = document.getElementById('rDate').value;
  const time  = document.getElementById('rTime').value;
  const note  = document.getElementById('rNote').value.trim();
  const sms   = document.getElementById('rSms').checked;

  if (!title) { toast('Please enter a title', 't-err'); return; }
  if (!date)  { toast('Please select a date', 't-err'); return; }
  if (!time)  { toast('Please select a time', 't-err'); return; }

  const ts = new Date(date + 'T' + time).getTime();
  if (isNaN(ts)) { toast('Invalid date/time', 't-err'); return; }

  if (editingId) {
    const idx = reminders.findIndex(r => r.id === editingId);
    if (idx >= 0) {
      reminders[idx] = { ...reminders[idx], title, ts, note, sms };
      alerted.delete(editingId);
      saveAlerted();
    }
    cancelEdit();
    toast('Reminder updated', 't-ok');
  } else {
    reminders.push({ id: Date.now().toString(), title, ts, note, sms });
    toast('Reminder saved' + (sms ? ' + SMS enabled' : ''), 't-ok');
  }

  save();
  clearForm();
  renderAll();
}

function deleteReminder(id) {
  if (!confirm('Delete this reminder?')) return;
  reminders = reminders.filter(r => r.id !== id);
  alerted.delete(id);
  save(); saveAlerted();
  renderAll();
  toast('Deleted', 't-ok');
}

function editReminder(id) {
  const r = reminders.find(r => r.id === id);
  if (!r) return;
  editingId = id;
  const dt = new Date(r.ts);
  document.getElementById('rTitle').value = r.title;
  document.getElementById('rDate').value  = dt.toISOString().split('T')[0];
  document.getElementById('rTime').value  = dt.toTimeString().slice(0,5);
  document.getElementById('rNote').value  = r.note || '';
  document.getElementById('rSms').checked = !!r.sms;
  document.getElementById('formTitle').textContent = 'Edit Reminder';
  document.getElementById('cancelEdit').style.display = 'inline-flex';
  document.getElementById('rTitle').focus();
}

function cancelEdit() {
  editingId = null;
  document.getElementById('formTitle').textContent = 'Add Reminder';
  document.getElementById('cancelEdit').style.display = 'none';
  clearForm();
}

function clearForm() {
  document.getElementById('rTitle').value = '';
  document.getElementById('rTime').value  = '';
  document.getElementById('rNote').value  = '';
  document.getElementById('rSms').checked = false;
  // Keep date (user may want to add multiple on same day)
}

function clearPast() {
  if (!confirm('Remove all past reminders?')) return;
  const now = Date.now();
  reminders = reminders.filter(r => r.ts > now);
  save(); renderAll();
  toast('Past reminders cleared', 't-ok');
}

// ── Boot ──────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  load();

  // Default form date to today
  document.getElementById('rDate').value = new Date().toISOString().split('T')[0];

  renderCalendar();
  renderAll();

  // Check reminders every 30 seconds
  checkReminders();
  setInterval(checkReminders, 30000);
});
</script>
</body>
</html>
