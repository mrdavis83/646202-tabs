<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parts — Store 646202</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--border:#e2e8f0;--accent:#e8292d;--accent2:#1e3a5f;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);padding:20px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:14px}
.vin-row{display:flex;gap:8px;align-items:flex-end}
input,select{font-family:var(--font);font-size:13px;border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surface);color:var(--text);outline:none}
input:focus{border-color:var(--accent2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.result-item label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);display:block;margin-bottom:3px}
.result-item .val{font-size:14px;font-weight:600;font-family:var(--mono)}
.parts-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ptab{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--surface);cursor:pointer;font-size:12px;font-weight:500;color:var(--text2)}
.ptab.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.ref-table{width:100%;border-collapse:collapse;font-size:13px}
.ref-table th{text-align:left;padding:7px 10px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.ref-table td{padding:7px 10px;border-bottom:1px solid var(--border)}
.ref-table tr:last-child td{border-bottom:none}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="card">
  <div class="card-title">🔍 VIN Decoder</div>
  <div class="vin-row">
    <input id="vin-input" placeholder="Enter 17-character VIN" style="flex:1;font-family:var(--mono);letter-spacing:.05em" maxlength="17">
    <button class="btn btn-primary" onclick="decodeVIN()">Decode</button>
  </div>
  <div id="vin-result" style="margin-top:14px"></div>
</div>

<div class="card">
  <div class="card-title">📋 Parts Quick Reference</div>
  <div class="parts-tabs">
    <button class="ptab active" onclick="showPart('batteries',this)">🔋 Batteries</button>
    <button class="ptab" onclick="showPart('wipers',this)">🪟 Wipers</button>
    <button class="ptab" onclick="showPart('brakes',this)">🛑 Brakes</button>
    <button class="ptab" onclick="showPart('filters',this)">🔧 Filters</button>
    <button class="ptab" onclick="showPart('belts',this)">⚙️ Belts</button>
    <button class="ptab" onclick="showPart('fluids',this)">💧 Fluids</button>
  </div>
  <div id="parts-content"></div>
</div>

<div class="card">
  <div class="card-title">📝 Notes</div>
  <textarea id="parts-notes" style="width:100%;min-height:100px;resize:vertical;font-family:var(--font);font-size:13px;border:1px solid var(--border);border-radius:6px;padding:10px;outline:none" placeholder="Parts notes..."></textarea>
  <button class="btn" style="margin-top:8px" onclick="saveNotes()">Save Notes</button>
</div>

<script>
const PARTS_DATA = {
  batteries: `<table class="ref-table"><thead><tr><th>Group</th><th>CCA Range</th><th>Common Vehicles</th></tr></thead><tbody>
    <tr><td>24/24F</td><td>550-750</td><td>Acura, Honda, Lexus, Toyota</td></tr>
    <tr><td>34/78</td><td>650-800</td><td>Chrysler, GM trucks</td></tr>
    <tr><td>35</td><td>550-640</td><td>Honda, Nissan, Subaru, Toyota</td></tr>
    <tr><td>47 (H5)</td><td>600-730</td><td>Buick, Chevy, VW, Audi</td></tr>
    <tr><td>48 (H6)</td><td>680-760</td><td>BMW, Chevy, GMC, Jeep, VW</td></tr>
    <tr><td>49 (H8)</td><td>800-900</td><td>Audi, BMW, Mercedes</td></tr>
    <tr><td>51R</td><td>500-600</td><td>Honda, Mazda, Nissan</td></tr>
    <tr><td>65</td><td>650-850</td><td>Ford F-series, Lincoln, Mercury</td></tr>
    <tr><td>96R</td><td>590-650</td><td>Buick, Cadillac, Chevy, GMC</td></tr>
  </tbody></table>`,
  wipers: `<table class="ref-table"><thead><tr><th>Vehicle</th><th>Driver</th><th>Passenger</th><th>Rear</th></tr></thead><tbody>
    <tr><td>Honda Civic 2016-22</td><td>26"</td><td>16"</td><td>14"</td></tr>
    <tr><td>Honda Accord 2018-22</td><td>26"</td><td>19"</td><td>—</td></tr>
    <tr><td>Toyota Camry 2018-22</td><td>26"</td><td>16"</td><td>—</td></tr>
    <tr><td>Toyota RAV4 2019-22</td><td>26"</td><td>16"</td><td>12"</td></tr>
    <tr><td>Ford F-150 2015-22</td><td>22"</td><td>22"</td><td>—</td></tr>
    <tr><td>Ford Escape 2020-22</td><td>26"</td><td>16"</td><td>12"</td></tr>
    <tr><td>Chevy Equinox 2018-22</td><td>24"</td><td>16"</td><td>12"</td></tr>
    <tr><td>Nissan Rogue 2021-22</td><td>26"</td><td>14"</td><td>12"</td></tr>
  </tbody></table><p style="color:var(--text3);font-size:12px;margin-top:8px">⚠️ Always verify with vehicle lookup tool</p>`,
  brakes: `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div><div style="font-weight:600;margin-bottom:8px;font-size:13px">Pad Wear Indicators</div>
    <table class="ref-table"><thead><tr><th>Thickness</th><th>Status</th></tr></thead><tbody>
    <tr><td>>4mm</td><td style="color:#16a34a;font-weight:600">Good</td></tr>
    <tr><td>3–4mm</td><td style="color:#d97706;font-weight:600">Monitor</td></tr>
    <tr><td>2–3mm</td><td style="color:#ea580c;font-weight:600">Replace Soon</td></tr>
    <tr><td><2mm</td><td style="color:#dc2626;font-weight:600">Replace Now</td></tr>
    </tbody></table></div>
    <div><div style="font-weight:600;margin-bottom:8px;font-size:13px">Common Lug Torques (ft-lb)</div>
    <table class="ref-table"><thead><tr><th>Make</th><th>Torque</th></tr></thead><tbody>
    <tr><td>Chrysler/Dodge/Jeep</td><td>95–115</td></tr>
    <tr><td>Ford</td><td>100–150</td></tr>
    <tr><td>GM/Chevy/GMC</td><td>100–140</td></tr>
    <tr><td>Honda/Acura</td><td>80–95</td></tr>
    <tr><td>Hyundai/Kia</td><td>65–80</td></tr>
    <tr><td>Nissan/Infiniti</td><td>83–108</td></tr>
    <tr><td>Toyota/Lexus</td><td>76–103</td></tr>
    </tbody></table></div></div>`,
  filters: `<table class="ref-table"><thead><tr><th>Filter Type</th><th>Service Interval</th><th>Notes</th></tr></thead><tbody>
    <tr><td>Engine Oil Filter</td><td>Every oil change</td><td>Match to oil type (conventional/synthetic)</td></tr>
    <tr><td>Engine Air Filter</td><td>15,000–30,000 mi</td><td>Inspect at every oil change</td></tr>
    <tr><td>Cabin Air Filter</td><td>15,000–25,000 mi</td><td>Annually or when restricted</td></tr>
    <tr><td>Fuel Filter (inline)</td><td>30,000 mi or per spec</td><td>Many modern vehicles have lifetime filters</td></tr>
    <tr><td>Transmission Filter</td><td>30,000–60,000 mi</td><td>Varies — check OEM specs</td></tr>
  </tbody></table>`,
  belts: `<table class="ref-table"><thead><tr><th>Item</th><th>Service Interval</th><th>Notes</th></tr></thead><tbody>
    <tr><td>Serpentine Belt</td><td>60,000–100,000 mi</td><td>Inspect for cracks, glazing, fraying</td></tr>
    <tr><td>Timing Belt</td><td>60,000–105,000 mi</td><td>⚠️ Check OEM spec — interference vs non-interference engine</td></tr>
    <tr><td>Timing Chain</td><td>Lifetime (inspect)</td><td>Listen for rattle on cold start</td></tr>
    <tr><td>Drive Belt Tensioner</td><td>Replace with serpentine belt</td><td>Always replace together</td></tr>
    <tr><td>Idler Pulley</td><td>Replace with serpentine belt</td><td>Check for bearing noise</td></tr>
  </tbody></table>`,
  fluids: `<table class="ref-table"><thead><tr><th>Fluid</th><th>Color (new)</th><th>Service Interval</th></tr></thead><tbody>
    <tr><td>Engine Oil</td><td>Amber/gold</td><td>Per OEM spec (3k–10k mi)</td></tr>
    <tr><td>Coolant/Antifreeze</td><td>Green, orange, pink, blue</td><td>30,000–50,000 mi or 5 years</td></tr>
    <tr><td>Brake Fluid (DOT3/4)</td><td>Clear/light yellow</td><td>Every 2 years or 30,000 mi</td></tr>
    <tr><td>Power Steering Fluid</td><td>Clear/red</td><td>Inspect annually — flush per spec</td></tr>
    <tr><td>Transmission Fluid (ATF)</td><td>Red/pink</td><td>30,000–60,000 mi (check OEM)</td></tr>
    <tr><td>Differential Fluid</td><td>Amber</td><td>30,000–60,000 mi</td></tr>
    <tr><td>Transfer Case Fluid</td><td>Amber</td><td>30,000 mi (4WD/AWD)</td></tr>
  </tbody></table>`
};

function showPart(id, btn) {
  document.querySelectorAll('.ptab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('parts-content').innerHTML = PARTS_DATA[id] || '<p style="color:var(--text3)">No data</p>';
}

async function decodeVIN() {
  const vin = (document.getElementById('vin-input').value || '').trim().toUpperCase();
  const out = document.getElementById('vin-result');
  if (vin.length !== 17) { out.innerHTML = '<p style="color:#dc2626">VIN must be exactly 17 characters</p>'; return; }
  out.innerHTML = '<span class="spinner"></span> Decoding...';
  try {
    const r = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${vin}?format=json`);
    const d = await r.json();
    const v = d.Results[0];
    const fields = [
      ['Year', v.ModelYear], ['Make', v.Make], ['Model', v.Model],
      ['Trim', v.Trim], ['Body', v.BodyClass], ['Engine', v.DisplacementL ? v.DisplacementL+'L' : v.EngineModel],
      ['Drive', v.DriveType], ['Fuel', v.FuelTypePrimary], ['Cylinders', v.EngineCylinders]
    ].filter(([,val]) => val && val !== 'Not Applicable');
    out.innerHTML = `<div class="result-grid">${fields.map(([l,v]) => `<div class="result-item"><label>${l}</label><div class="val">${v}</div></div>`).join('')}</div>`;
  } catch(e) {
    out.innerHTML = '<p style="color:#dc2626">Decode failed — check VIN and try again</p>';
  }
}

function saveNotes() {
  try { localStorage.setItem('partsnotes646202', document.getElementById('parts-notes').value); } catch(e) {}
  const btn = event.target;
  btn.textContent = 'Saved ✓';
  setTimeout(() => btn.textContent = 'Save Notes', 2000);
}

document.addEventListener('DOMContentLoaded', () => {
  try { document.getElementById('parts-notes').value = localStorage.getItem('partsnotes646202') || ''; } catch(e) {}
  showPart('batteries', document.querySelector('.ptab'));
});
</script>
</body>
</html>
