<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Articles — Store 646202</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--border:#e2e8f0;
  --accent:#e8292d;--accent2:#1e3a5f;--text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);padding:16px;font-size:14px}

/* ── ADD FORM ── */
.add-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.add-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:8px}
.add-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.add-row .field{display:flex;flex-direction:column;gap:3px}
.add-row label{font-size:11px;font-weight:600;color:var(--text2)}
.fi{font-family:var(--font);font-size:13px;border:1px solid var(--border);border-radius:6px;padding:6px 9px;outline:none;background:var(--surface);color:var(--text)}
.fi:focus{border-color:var(--accent2)}
.f-num{width:100px;font-family:var(--mono)}
.f-price{width:80px}
.f-cat{width:115px}
.f-desc{flex:1;min-width:180px}
.f-notes{width:150px}

/* ── TOOLBAR ── */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:160px}
.count{font-size:12px;color:var(--text3);margin-left:auto;white-space:nowrap}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;line-height:1}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn-primary:hover{background:#162d4a}
.btn-edit{background:#f0fdf4;color:#15803d;border-color:#86efac}
.btn-edit:hover{background:#dcfce7}
.btn-save{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn-save:hover{background:#162d4a}
.btn-del{border-color:#fca5a5;color:#dc2626}
.btn-del:hover{background:#fef2f2}

/* ── TABLE ── */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead{background:var(--surface2)}
th{padding:8px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--text2);background:#e8edf2}
th.sort-active{color:var(--accent2)}
.sort-icon{margin-left:2px;opacity:.5;font-size:9px}
th.sort-active .sort-icon{opacity:1;color:var(--accent2)}
td{padding:7px 10px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
tr.checked td{background:#eff6ff}

/* ── CATEGORY BADGE ── */
.cat-badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.cat-labor{background:#fef9c3;color:#854d0e}
.cat-parts{background:#dbeafe;color:#1d4ed8}
.cat-tire{background:#f3e8ff;color:#6b21a8}
.cat-oil{background:#dcfce7;color:#15803d}
.cat-misc{background:#f1f5f9;color:#475569}
.cat-discount{background:#fee2e2;color:#b91c1c}
.cat-custom{background:#f0f4ff;color:#3730a3}

/* ── INLINE EDIT ── */
.editable{display:block;padding:2px 4px;border-radius:4px;border:1px solid transparent;outline:none}
.editable:hover{border-color:var(--border);background:var(--surface2);cursor:text}
.editable:focus{border-color:var(--accent2);background:var(--surface)}
.desc-locked{cursor:default !important}
.desc-locked:hover{border-color:transparent !important;background:transparent !important}

/* ── CATEGORY PICKER ── */
.cat-select{font-family:var(--font);font-size:11px;font-weight:700;border:1px solid transparent;border-radius:4px;padding:2px 5px;cursor:pointer;outline:none;width:auto;max-width:105px}
.cat-select:hover{border-color:var(--border)}
.cat-select:focus{border-color:var(--accent2)}

/* ── ACTION BAR (in header) ── */
.action-bar{display:none;gap:5px;align-items:center}

/* ── CHECKBOX ── */
input[type=checkbox]{cursor:pointer;width:14px;height:14px;accent-color:var(--accent2)}

/* ── EMPTY ── */
.empty-row td{text-align:center;padding:30px;color:var(--text3)}

/* ── CAT DROPDOWN ── */
.cat-drop-wrap{position:relative}
.cat-drop-menu{display:none;position:absolute;top:100%;left:0;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:200;overflow:hidden}
.cat-drop-item{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;cursor:pointer;font-size:13px}
.cat-drop-item:hover{background:var(--surface2)}
.cat-drop-rm{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:0 2px;line-height:1}
.cat-drop-rm:hover{color:#dc2626}
.cat-drop-footer{padding:6px 8px;border-top:1px solid var(--border);display:flex;gap:5px}
.cat-drop-input{flex:1;font-family:var(--font);font-size:12px;border:1px solid var(--border);border-radius:4px;padding:4px 7px;outline:none}
.cat-drop-input:focus{border-color:var(--accent2)}
</style>
</head>
<body>

<!-- ── ADD FORM ── -->
<div class="add-card">
  <div class="add-title">Add Article Number</div>
  <div class="add-row">
    <div class="field"><label>Article #</label><input class="fi f-num" id="a-num" placeholder="7004578"></div>
    <div class="field"><label>Price</label><input class="fi f-price" id="a-price" placeholder="0.00"></div>
    <div class="field"><label>Category</label>
      <div class="cat-drop-wrap">
        <input class="fi f-cat" id="a-cat" placeholder="Category..." readonly onclick="toggleAddCatDrop()" style="cursor:pointer">
        <div class="cat-drop-menu" id="add-cat-menu">
          <div id="add-cat-list"></div>
          <div class="cat-drop-footer">
            <input class="cat-drop-input" id="add-cat-new" placeholder="New category..." onkeydown="if(event.key==='Enter')addCat()">
            <button class="btn btn-primary" style="padding:4px 9px;font-size:11px" onclick="addCat()">+ Add</button>
          </div>
        </div>
      </div>
    </div>
    <div class="field" style="flex:1;min-width:180px"><label>Description</label><input class="fi f-desc" id="a-desc" placeholder="Description"></div>
    <div class="field"><label>Notes</label><input class="fi f-notes" id="a-notes" placeholder="Optional"></div>
    <div class="field" style="padding-top:1px"><label>&nbsp;</label><button class="btn btn-primary" onclick="addArticle()">+ Add</button></div>
  </div>
</div>

<!-- ── TOOLBAR ── -->
<div class="toolbar">
  <input class="fi" id="srch" placeholder="🔍 Search article numbers..." oninput="render()">
  <select class="fi" id="cat-filter" onchange="render()" style="width:150px">
    <option value="all">All Categories</option>
  </select>
  <button class="btn" onclick="exportCSV()" style="font-size:12px">⬇ CSV</button>
  <span class="count" id="art-count"></span>
</div>

<!-- ── TABLE ── -->
<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th style="width:34px;text-align:center">
        <input type="checkbox" id="chk-all" onclick="toggleAll(this)">
      </th>
      <th class="sortable" onclick="sortBy('num')" id="th-num" style="width:100px">Article # <span class="sort-icon" id="si-num"></span></th>
      <th class="sortable" onclick="sortBy('price')" id="th-price" style="width:80px;text-align:center">Price <span class="sort-icon" id="si-price"></span></th>
      <th class="sortable" onclick="sortBy('cat')" id="th-cat" style="width:115px;text-align:center">Category <span class="sort-icon" id="si-cat"></span></th>
      <th class="sortable" onclick="sortBy('desc')" id="th-desc" style="width:280px">Description <span class="sort-icon" id="si-desc"></span></th>
      <th class="sortable" onclick="sortBy('notes')" id="th-notes" style="width:150px">Notes <span class="sort-icon" id="si-notes"></span></th>
      <th style="width:160px;padding:6px 10px">
        <div class="action-bar" id="action-bar">
          <button class="btn btn-edit" style="padding:4px 9px;font-size:11px" onclick="editChecked()">Edit</button>
          <button class="btn btn-save" style="padding:4px 9px;font-size:11px" id="global-save" onclick="saveChecked()">Save</button>
          <button class="btn btn-del" style="padding:4px 9px;font-size:11px" onclick="delChecked()">Del</button>
        </div>
      </th>
    </tr>
  </thead>
  <tbody id="art-body"></tbody>
</table>
</div>

<script>
// ── DATA ──
const BUILTIN = [{"num": "7004578", "cat": "labor", "desc": "Alignments (1 time)", "price": "", "notes": ""}, {"num": "7005229", "cat": "labor", "desc": "(LTA) Lifetime Wheel Alignment", "price": "", "notes": ""}, {"num": "7015515", "cat": "misc", "desc": "STEERING ANGLE reset (SAS) $20", "price": "", "notes": ""}, {"num": "7034294", "cat": "misc", "desc": "Steering Angle reset (SAS) $0", "price": "", "notes": ""}, {"num": "7097782", "cat": "misc", "desc": "ROAD HAZARD PROTECTION", "price": "", "notes": ""}, {"num": "7016233", "cat": "parts", "desc": "Adjust & clean brakes", "price": "", "notes": ""}, {"num": "7006472", "cat": "labor", "desc": "Low profile labor", "price": "", "notes": ""}, {"num": "7030260", "cat": "parts", "desc": "Misc: Brake Parts", "price": "", "notes": ""}, {"num": "7041556", "cat": "labor", "desc": "Misc: Brake Labor", "price": "", "notes": ""}, {"num": "7000711", "cat": "parts", "desc": "Misc: Nuts Bolts Fasteners", "price": "", "notes": ""}, {"num": "7040231", "cat": "misc", "desc": "Sale Tax Credit", "price": "", "notes": ""}, {"num": "7003002", "cat": "parts", "desc": "Fuel System parts", "price": "", "notes": ""}, {"num": "7003030", "cat": "parts", "desc": "Engine system parts", "price": "", "notes": ""}, {"num": "7003051", "cat": "parts", "desc": "Charging system parts", "price": "", "notes": ""}, {"num": "7003081", "cat": "parts", "desc": "Starting system parts", "price": "", "notes": ""}, {"num": "7003106", "cat": "parts", "desc": "Steering system parts", "price": "", "notes": ""}, {"num": "7003130", "cat": "parts", "desc": "Wiper parts", "price": "", "notes": ""}, {"num": "7003161", "cat": "parts", "desc": "Drive train parts", "price": "", "notes": ""}, {"num": "7003219", "cat": "labor", "desc": "Fuel System labor", "price": "", "notes": ""}, {"num": "cxz001392", "cat": "labor", "desc": "Fuel System labor (alt)", "price": "", "notes": ""}, {"num": "7003240", "cat": "parts", "desc": "Engine system parts", "price": "", "notes": ""}, {"num": "7003281", "cat": "labor", "desc": "Emission system labor", "price": "", "notes": ""}, {"num": "7003303", "cat": "parts", "desc": "Steering system parts", "price": "", "notes": ""}, {"num": "7003317", "cat": "parts", "desc": "Wiper parts", "price": "", "notes": ""}, {"num": "7003348", "cat": "labor", "desc": "Accessories labor", "price": "", "notes": ""}, {"num": "7003362", "cat": "parts", "desc": "Drive train parts", "price": "", "notes": ""}, {"num": "7003386", "cat": "parts", "desc": "Starting system parts", "price": "", "notes": ""}, {"num": "7018651", "cat": "labor", "desc": "Under hood labor", "price": "", "notes": ""}];
let articles = BUILTIN.slice();
let serverLoaded = false;

// ── CATEGORIES ──
const DEFAULT_CATS = ['labor','parts','tire','oil','misc','discount'];
let categories = DEFAULT_CATS.slice();

function loadCats() {
  try {
    const s = JSON.parse(localStorage.getItem('artCats646202') || 'null');
    if (Array.isArray(s) && s.length) categories = s;
  } catch(e) {}
}
function saveCats() {
  try { localStorage.setItem('artCats646202', JSON.stringify(categories)); } catch(e) {}
}
function catClass(c) {
  const map = {labor:'cat-labor',parts:'cat-parts',tire:'cat-tire',oil:'cat-oil',misc:'cat-misc',discount:'cat-discount'};
  return map[c] || 'cat-custom';
}
function capFirst(s) { return s ? s.charAt(0).toUpperCase()+s.slice(1) : ''; }

function rebuildCatFilter() {
  const sel = document.getElementById('cat-filter');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">All Categories</option>' +
    categories.map(c => `<option value="${c}"${c===cur?' selected':''}>${capFirst(c)}</option>`).join('');
}

function buildAddCatList() {
  const list = document.getElementById('add-cat-list');
  if (!list) return;
  list.innerHTML = categories.map(c => `
    <div class="cat-drop-item" onclick="selectAddCat('${c}')">
      <span>${capFirst(c)}</span>
      <button class="cat-drop-rm" onclick="event.stopPropagation();removeCat('${c}')" title="Remove">✕</button>
    </div>`).join('');
}

function toggleAddCatDrop() {
  const m = document.getElementById('add-cat-menu');
  const open = m.style.display === 'block';
  m.style.display = open ? 'none' : 'block';
  if (!open) buildAddCatList();
}
function selectAddCat(c) {
  document.getElementById('a-cat').value = c;
  document.getElementById('add-cat-menu').style.display = 'none';
}
function addCat() {
  const inp = document.getElementById('add-cat-new');
  const val = inp.value.trim().toLowerCase().replace(/\s+/g,'_');
  if (!val) return;
  if (!categories.includes(val)) { categories.push(val); saveCats(); }
  selectAddCat(val);
  rebuildCatFilter();
  inp.value = '';
}
function removeCat(c) {
  if (!confirm('Remove category "'+c+'"?\nExisting articles keep their category value.')) return;
  categories = categories.filter(x => x !== c);
  saveCats(); rebuildCatFilter(); buildAddCatList(); render();
}

// Close add-cat dropdown on outside click
document.addEventListener('click', e => {
  const wrap = document.querySelector('.cat-drop-wrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('add-cat-menu').style.display = 'none';
  }
});

// ── SORT ──
let sortField = null, sortDir = 1;
function sortBy(field) {
  if (sortField === field) sortDir *= -1; else { sortField = field; sortDir = 1; }
  document.querySelectorAll('th[id^="th-"]').forEach(t => t.classList.remove('sort-active'));
  document.querySelectorAll('.sort-icon').forEach(s => s.textContent = '');
  const th = document.getElementById('th-'+field);
  const si = document.getElementById('si-'+field);
  if (th) th.classList.add('sort-active');
  if (si) si.textContent = sortDir === 1 ? '▲' : '▼';
  render();
}
function sorted(arr) {
  if (!sortField) return arr;
  return [...arr].sort((a,b) => {
    const av = (a[sortField]||'').toLowerCase();
    const bv = (b[sortField]||'').toLowerCase();
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });
}

// ── SAVE / LOAD ──
function save() {
  try { localStorage.setItem('articles646202', JSON.stringify(articles)); } catch(e) {}
  if (!serverLoaded) return;
  fetch('/data/articles.json', {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(articles)}).catch(()=>{});
}

// ── RENDER ──
function render() {
  const q = (document.getElementById('srch').value||'').toLowerCase();
  const cf = document.getElementById('cat-filter').value;
  const filtered = sorted(articles.filter(a =>
    (cf==='all' || a.cat===cf) &&
    (!q || (a.num+' '+a.desc+' '+(a.notes||'')).toLowerCase().includes(q))
  ));
  document.getElementById('art-count').textContent = filtered.length+' of '+articles.length+' articles';
  const tbody = document.getElementById('art-body');
  if (!filtered.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="7">No articles match</td></tr>';
    return;
  }
  tbody.innerHTML = filtered.map(a => {
    const catOpts = categories.map(c => `<option value="${c}"${a.cat===c?' selected':''}>${capFirst(c)}</option>`).join('');
    const badgeCls = catClass(a.cat||'misc');
    return `<tr id="row-${a.num}">
      <td style="text-align:center;width:34px">
        <input type="checkbox" class="row-chk" data-num="${a.num}" onchange="onCheck('${a.num}',this.checked)">
      </td>
      <td style="width:100px;font-family:var(--mono);font-weight:700;white-space:nowrap">${a.num}</td>
      <td style="width:80px;text-align:center;font-family:var(--mono)">
        <span class="editable" contenteditable="true" spellcheck="false"
          data-num="${a.num}" data-field="price"
          onblur="onEdit('${a.num}','price',this.innerText.trim())"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
        >${a.price||''}</span>
      </td>
      <td style="width:115px;text-align:center">
        <select class="cat-select ${badgeCls}" data-num="${a.num}"
          onchange="onEdit('${a.num}','cat',this.value);applyCatStyle(this)"
          onfocus="this.style.borderColor='var(--accent2)'"
          onblur="this.style.borderColor='transparent'"
        >${catOpts}</select>
      </td>
      <td style="width:280px">
        <span class="editable desc-locked" id="desc-${a.num}" contenteditable="false" spellcheck="false"
          data-num="${a.num}" data-field="desc"
          onblur="onEdit('${a.num}','desc',this.innerText.trim());lockDesc('${a.num}')"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
        >${a.desc||''}</span>
      </td>
      <td style="width:150px">
        <span class="editable" contenteditable="true" spellcheck="false"
          data-num="${a.num}" data-field="notes"
          onblur="onEdit('${a.num}','notes',this.innerText.trim())"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
          style="color:var(--text3);font-size:12px"
        >${a.notes||''}</span>
      </td>
      <td style="width:160px"></td>
    </tr>`;
  }).join('');
  // Re-apply cat badge styles
  document.querySelectorAll('.cat-select').forEach(applyCatStyle);
  // Re-apply checked state
  document.querySelectorAll('.row-chk').forEach(cb => {
    if (checkedNums.has(cb.dataset.num)) { cb.checked = true; cb.closest('tr').classList.add('checked'); }
  });
  updateActionBar();
}

function applyCatStyle(sel) {
  const cat = sel.value || 'misc';
  const styles = {
    labor:{bg:'#fef9c3',color:'#854d0e'},parts:{bg:'#dbeafe',color:'#1d4ed8'},
    tire:{bg:'#f3e8ff',color:'#6b21a8'},oil:{bg:'#dcfce7',color:'#15803d'},
    misc:{bg:'#f1f5f9',color:'#475569'},discount:{bg:'#fee2e2',color:'#b91c1c'}
  };
  const s = styles[cat] || {bg:'#f0f4ff',color:'#3730a3'};
  sel.style.background = s.bg;
  sel.style.color = s.color;
  sel.style.borderColor = 'transparent';
}

// ── EDIT ──
function onEdit(num, field, val) {
  const a = articles.find(a => a.num===num);
  if (a && a[field] !== val) { a[field] = val; }
}

function lockDesc(num) {
  const el = document.getElementById('desc-'+num);
  if (!el) return;
  el.contentEditable = 'false';
  el.classList.add('desc-locked');
}
function unlockDesc(num) {
  const el = document.getElementById('desc-'+num);
  if (!el) return;
  el.contentEditable = 'true';
  el.classList.remove('desc-locked');
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}

// ── CHECKBOX / ACTION BAR ──
let checkedNums = new Set();

function onCheck(num, checked) {
  if (checked) checkedNums.add(num); else checkedNums.delete(num);
  const row = document.getElementById('row-'+num);
  if (row) row.classList.toggle('checked', checked);
  if (!checked) lockDesc(num);
  updateActionBar();
  // update check-all
  const all = document.querySelectorAll('.row-chk');
  const allChk = document.getElementById('chk-all');
  if (allChk) {
    allChk.checked = all.length > 0 && [...all].every(c=>c.checked);
    allChk.indeterminate = checkedNums.size > 0 && !allChk.checked;
  }
}

function toggleAll(cb) {
  document.querySelectorAll('.row-chk').forEach(c => {
    c.checked = cb.checked;
    onCheck(c.dataset.num, cb.checked);
  });
}

function updateActionBar() {
  const bar = document.getElementById('action-bar');
  if (bar) bar.style.display = checkedNums.size > 0 ? 'flex' : 'none';
}

function editChecked() {
  if (checkedNums.size === 1) unlockDesc([...checkedNums][0]);
}

function saveChecked() {
  checkedNums.forEach(num => {
    const a = articles.find(a=>a.num===num);
    const descEl = document.getElementById('desc-'+num);
    if (a && descEl) a.desc = descEl.innerText.trim();
  });
  save();
  const btn = document.getElementById('global-save');
  if (btn) {
    btn.textContent = 'Saved ✓';
    btn.style.background = '#16a34a';
    setTimeout(() => {
      checkedNums.clear();
      document.querySelectorAll('.row-chk').forEach(c => { c.checked=false; });
      document.querySelectorAll('tr.checked').forEach(r => r.classList.remove('checked'));
      document.querySelectorAll('.desc-locked'+'[contenteditable="true"]').forEach(el => lockDesc(el.dataset.num));
      document.querySelectorAll('[id^="desc-"]').forEach(el => lockDesc(el.dataset.num));
      const allChk = document.getElementById('chk-all');
      if (allChk) { allChk.checked=false; allChk.indeterminate=false; }
      updateActionBar();
      btn.textContent = 'Save';
      btn.style.background = 'var(--accent2)';
    }, 1000);
  }
}

function delChecked() {
  if (!checkedNums.size) return;
  if (!confirm('Delete '+checkedNums.size+' article(s)?')) return;
  articles = articles.filter(a => !checkedNums.has(a.num));
  checkedNums.clear();
  save(); render();
}

// ── ADD ARTICLE ──
function addArticle() {
  const num = (document.getElementById('a-num').value||'').trim();
  if (!num) { document.getElementById('a-num').focus(); return; }
  if (articles.find(a=>a.num===num)) { alert('Article # '+num+' already exists'); return; }
  articles.push({
    num, price:(document.getElementById('a-price').value||'').trim(),
    cat:(document.getElementById('a-cat').value||'misc').toLowerCase().trim(),
    desc:(document.getElementById('a-desc').value||'').trim(),
    notes:(document.getElementById('a-notes').value||'').trim()
  });
  save(); render();
  ['a-num','a-price','a-cat','a-desc','a-notes'].forEach(id => {
    const el = document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('a-num').focus();
}

// ── EXPORT ──
function exportCSV() {
  const rows = [['Article #','Price','Category','Description','Notes']];
  articles.forEach(a => rows.push([a.num, a.price, a.cat, a.desc, a.notes]));
  const csv = rows.map(r => r.map(v=>'"'+(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const el = document.createElement('a');
  el.href = 'data:text/csv,'+encodeURIComponent(csv);
  el.download = 'articles_646202.csv';
  el.click();
}

// ── INIT ──
loadCats();
rebuildCatFilter();
render();

// Fetch server data in background
fetch('/data/articles.json?_='+Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    serverLoaded = true;
    if (Array.isArray(d) && d.length >= BUILTIN.length) { articles = d; render(); }
  })
  .catch(() => { serverLoaded = true; });
</script>
