<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor – Bridgestone Firestone Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9; --border:#e2e8f0;
    --accent:#e8292d; --accent2:#1e3a5f;
    --text:#0f172a; --text2:#475569; --text3:#94a3b8;
    --green:#16a34a; --amber:#d97706; --red:#dc2626;
    --font:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .page-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent2);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .page-title svg { flex-shrink: 0; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 6px;
    font-family: var(--font);
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: background .15s, border-color .15s, opacity .15s;
    text-decoration: none;
  }
  .btn:hover { background: var(--surface2); }
  .btn-primary {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #fff;
  }
  .btn-primary:hover { opacity: .88; background: var(--accent2); }
  .btn-danger {
    border-color: var(--red);
    color: var(--red);
  }
  .btn-danger:hover { background: #fef2f2; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Health Summary Bar ── */
  .health-bar-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .health-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .health-label {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
  }
  .health-counts {
    display: flex;
    gap: 16px;
    font-size: 0.8rem;
    font-weight: 500;
    font-family: var(--mono);
  }
  .hc-up   { color: var(--green); }
  .hc-slow { color: var(--amber); }
  .hc-down { color: var(--red);   }
  .hc-chk  { color: var(--text3); }
  .health-track {
    height: 10px;
    border-radius: 99px;
    background: var(--surface2);
    overflow: hidden;
    display: flex;
    gap: 2px;
  }
  .health-segment {
    height: 100%;
    border-radius: 99px;
    transition: width .4s ease;
  }
  .seg-up   { background: var(--green); }
  .seg-slow { background: var(--amber); }
  .seg-down { background: var(--red);   }
  .seg-chk  { background: var(--text3); }
  .last-ping-note {
    font-size: 0.75rem;
    color: var(--text3);
    margin-top: 8px;
    font-family: var(--mono);
  }

  /* ── Grid ── */
  .monitor-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  @media (max-width: 900px) {
    .monitor-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .monitor-grid { grid-template-columns: 1fr; }
  }

  /* ── Service Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
    transition: box-shadow .2s;
  }
  .card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .card-accent-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 8px 8px 0 0;
    transition: background .3s;
  }
  .card.up   .card-accent-bar { background: var(--green); }
  .card.slow .card-accent-bar { background: var(--amber); }
  .card.down .card-accent-bar { background: var(--red);   }
  .card.checking .card-accent-bar { background: var(--text3); }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .card-name {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
    word-break: break-word;
  }
  .card-url {
    font-size: 0.72rem;
    color: var(--text3);
    font-family: var(--mono);
    word-break: break-all;
    line-height: 1.4;
  }
  .status-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 2px;
    box-shadow: 0 0 0 3px rgba(0,0,0,.06);
    transition: background .3s;
  }
  .dot-up      { background: var(--green); box-shadow: 0 0 0 4px rgba(22,163,74,.15); }
  .dot-slow    { background: var(--amber); box-shadow: 0 0 0 4px rgba(217,119,6,.15); }
  .dot-down    { background: var(--red);   box-shadow: 0 0 0 4px rgba(220,38,38,.15); }
  .dot-checking{
    background: var(--text3);
    animation: pulse-dot 1.2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:.5; transform:scale(.85); }
  }

  .card-stats {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stat-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 0.78rem;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--surface2);
    color: var(--text2);
  }
  .stat-badge.up   { color: var(--green); background: rgba(22,163,74,.08); }
  .stat-badge.slow { color: var(--amber); background: rgba(217,119,6,.08); }
  .stat-badge.down { color: var(--red);   background: rgba(220,38,38,.08); }

  .status-text {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .text-up      { color: var(--green); }
  .text-slow    { color: var(--amber); }
  .text-down    { color: var(--red);   }
  .text-checking{ color: var(--text3); }

  .card-timestamp {
    font-size: 0.7rem;
    color: var(--text3);
    font-family: var(--mono);
  }

  .sparkline-wrap {
    position: relative;
    height: 40px;
  }
  .sparkline-wrap canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn-remove {
    padding: 3px 8px;
    font-size: 0.7rem;
    border-radius: 4px;
    color: var(--text3);
    border-color: transparent;
    background: transparent;
  }
  .btn-remove:hover { color: var(--red); border-color: var(--red); background: #fef2f2; }

  /* ── Add Endpoint Form ── */
  .add-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    padding: 20px;
  }
  .add-section h3 {
    margin: 0 0 14px;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .add-form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
    min-width: 160px;
  }
  .form-group label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text2);
    letter-spacing: .02em;
  }
  .form-group input {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--font);
    font-size: 0.875rem;
    color: var(--text);
    background: var(--surface);
    outline: none;
    transition: border-color .15s;
  }
  .form-group input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(30,58,95,.1); }
  .form-group input::placeholder { color: var(--text3); }

  /* ── Countdown ── */
  .countdown-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.78rem;
    font-family: var(--mono);
    color: var(--text3);
    padding: 4px 10px;
    background: var(--surface2);
    border-radius: 99px;
    border: 1px solid var(--border);
  }
  .countdown-chip .cd-num {
    font-weight: 600;
    color: var(--text2);
    min-width: 18px;
    text-align: center;
  }

  /* ── Spinner for refresh btn ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { animation: spin .7s linear infinite; }
</style>
</head>
<body>

<!-- ── Page Header ── -->
<div class="page-header">
  <div class="page-title">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
    </svg>
    Monitor
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <div class="countdown-chip">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Next ping in <span class="cd-num" id="countdown">30</span>s
    </div>
    <button class="btn btn-primary" id="refreshBtn" onclick="refreshAll()">
      <svg id="refreshIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.7"/>
      </svg>
      Refresh All
    </button>
  </div>
</div>

<!-- ── Health Summary ── -->
<div class="health-bar-wrap">
  <div class="health-meta">
    <div class="health-label" id="healthLabel">Checking services…</div>
    <div class="health-counts">
      <span class="hc-up">  ● <span id="cntUp">0</span> UP</span>
      <span class="hc-slow">● <span id="cntSlow">0</span> SLOW</span>
      <span class="hc-down">● <span id="cntDown">0</span> DOWN</span>
      <span class="hc-chk"> ● <span id="cntChk">0</span> CHECKING</span>
    </div>
  </div>
  <div class="health-track" id="healthTrack">
    <div class="health-segment seg-chk" id="segChk" style="width:100%"></div>
  </div>
  <div class="last-ping-note" id="lastPingNote">Last full ping: —</div>
</div>

<!-- ── Service Cards Grid ── -->
<div class="monitor-grid" id="monitorGrid"></div>

<!-- ── Add Endpoint ── -->
<div class="add-section">
  <h3>+ Add Custom Endpoint</h3>
  <div class="add-form">
    <div class="form-group">
      <label for="newName">Service Name</label>
      <input type="text" id="newName" placeholder="My Service" maxlength="40">
    </div>
    <div class="form-group">
      <label for="newUrl">URL</label>
      <input type="url" id="newUrl" placeholder="https://example.com/health" maxlength="300">
    </div>
    <button class="btn btn-primary" onclick="addCustomEndpoint()" style="align-self:flex-end;white-space:nowrap;">
      Add &amp; Ping
    </button>
  </div>
</div>

<script>
/* ─────────────────────────────────────────
   CONSTANTS
───────────────────────────────────────── */
const DISPATCH_URL   = 'https://n8n.646202.com/webhook/dispatch';
const DISPATCH_TOKEN = 'a7fe255af893c3321935d0acc41f199a252e0392de13468cd31f195171baf4c8';
const SMS_WEBHOOK    = 'https://n8n.646202.com/webhook/sms';
const SMS_FROM       = '+15852572886';
const OWM_KEY        = 'c736ec887059fc3a4950e643c439b316';
const PHONEBOOK_URL  = '/data/phonebook.json';
const TRIAGE_URL     = '/data/triage.json';
const ARTICLES_URL   = '/data/articles.json';
const LS_KEY         = 'monitors646202';
const PING_INTERVAL  = 30; // seconds
const SLOW_THRESHOLD = 2000; // ms

/* ─────────────────────────────────────────
   DEFAULT ENDPOINTS
───────────────────────────────────────── */
const DEFAULT_ENDPOINTS = [
  { id: 'def-1', name: '646202.com',   url: 'https://646202.com',                builtin: true },
  { id: 'def-2', name: 'n8n',          url: 'https://n8n.646202.com',             builtin: true },
  { id: 'def-3', name: 'ntfy',         url: 'https://ntfy.646202.com',            builtin: true },
  { id: 'def-4', name: 'exec',         url: 'https://exec.646202.com/health',     builtin: true },
  { id: 'def-5', name: 'drive-mcp',    url: 'https://drive-mcp.646202.com',       builtin: true },
  { id: 'def-6', name: 'Uptime Kuma',  url: 'http://192.168.1.79:3001',           builtin: true },
  { id: 'def-7', name: 'Vaultwarden',  url: 'https://vault.646202.com',           builtin: true },
  { id: 'def-8', name: 'mmcp',         url: 'https://mmcp.646202.com',            builtin: true },
];

/* ─────────────────────────────────────────
   STATE
───────────────────────────────────────── */
let endpoints = [];       // { id, name, url, builtin?, status, responseTime, lastChecked, history[] }
let countdownVal = PING_INTERVAL;
let countdownTimer = null;
let refreshing = false;

/* ─────────────────────────────────────────
   INIT
───────────────────────────────────────── */
function init() {
  // Load custom endpoints from localStorage
  let custom = [];
  try { custom = JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch(e) { custom = []; }

  // Merge defaults + custom
  endpoints = DEFAULT_ENDPOINTS.map(ep => ({
    ...ep,
    status: 'checking',
    responseTime: null,
    lastChecked: null,
    history: []
  }));

  custom.forEach(c => {
    if (!endpoints.find(e => e.id === c.id)) {
      endpoints.push({
        id: c.id,
        name: c.name,
        url: c.url,
        builtin: false,
        status: 'checking',
        responseTime: null,
        lastChecked: null,
        history: []
      });
    }
  });

  renderGrid();
  refreshAll();
  startCountdown();
}

/* ─────────────────────────────────────────
   SAVE CUSTOM TO LOCALSTORAGE
───────────────────────────────────────── */
function saveCustomEndpoints() {
  const custom = endpoints.filter(e => !e.builtin).map(e => ({ id: e.id, name: e.name, url: e.url }));
  localStorage.setItem(LS_KEY, JSON.stringify(custom));
}

/* ─────────────────────────────────────────
   PING A SINGLE ENDPOINT
───────────────────────────────────────── */
async function pingEndpoint(ep) {
  ep.status = 'checking';
  updateCard(ep);
  updateSummary();

  const start = performance.now();
  try {
    // Use no-cors for cross-origin – we can detect network errors vs success
    // For same-origin we get real response; for cross-origin we get opaque (but no error = likely up)
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);

    await fetch(ep.url, {
      method: 'HEAD',
      mode: 'no-cors',
      cache: 'no-store',
      signal: controller.signal
    });
    clearTimeout(timeout);

    const elapsed = Math.round(performance.now() - start);
    ep.responseTime = elapsed;
    ep.status = elapsed > SLOW_THRESHOLD ? 'slow' : 'up';
  } catch(err) {
    ep.responseTime = null;
    ep.status = 'down';
  }

  ep.lastChecked = new Date();
  ep.history = [...(ep.history || []).slice(-9), ep.responseTime ?? 0];
  updateCard(ep);
  updateSummary();
}

/* ─────────────────────────────────────────
   REFRESH ALL
───────────────────────────────────────── */
async function refreshAll() {
  if (refreshing) return;
  refreshing = true;
  resetCountdown();

  const icon = document.getElementById('refreshIcon');
  const btn  = document.getElementById('refreshBtn');
  icon.classList.add('spinning');
  btn.disabled = true;

  await Promise.all(endpoints.map(ep => pingEndpoint(ep)));

  document.getElementById('lastPingNote').textContent =
    'Last full ping: ' + new Date().toLocaleTimeString();

  icon.classList.remove('spinning');
  btn.disabled = false;
  refreshing = false;
}

/* ─────────────────────────────────────────
   COUNTDOWN
───────────────────────────────────────── */
function startCountdown() {
  countdownTimer = setInterval(() => {
    countdownVal--;
    document.getElementById('countdown').textContent = countdownVal;
    if (countdownVal <= 0) {
      resetCountdown();
      refreshAll();
    }
  }, 1000);
}

function resetCountdown() {
  countdownVal = PING_INTERVAL;
  document.getElementById('countdown').textContent = countdownVal;
}

/* ─────────────────────────────────────────
   ADD CUSTOM ENDPOINT
───────────────────────────────────────── */
function addCustomEndpoint() {
  const nameEl = document.getElementById('newName');
  const urlEl  = document.getElementById('newUrl');
  const name = nameEl.value.trim();
  const url  = urlEl.value.trim();

  if (!name || !url) { alert('Please enter both a name and URL.'); return; }

  // Basic URL validation
  try { new URL(url); } catch(e) { alert('Please enter a valid URL (including http:// or https://).'); return; }

  const id = 'custom-' + Date.now();
  const ep = { id, name, url, builtin: false, status: 'checking', responseTime: null, lastChecked: null, history: [] };
  endpoints.push(ep);
  saveCustomEndpoints();

  nameEl.value = '';
  urlEl.value  = '';

  renderGrid();
  pingEndpoint(ep);
}

/* ─────────────────────────────────────────
   REMOVE ENDPOINT
───────────────────────────────────────── */
function removeEndpoint(id) {
  endpoints = endpoints.filter(e => e.id !== id);
  saveCustomEndpoints();
  const el = document.getElementById('card-' + id);
  if (el) el.remove();
  updateSummary();
}

/* ─────────────────────────────────────────
   STATUS HELPERS
───────────────────────────────────────── */
function statusDotClass(status) {
  return { up:'dot-up', slow:'dot-slow', down:'dot-down', checking:'dot-checking' }[status] || 'dot-checking';
}
function statusTextClass(status) {
  return { up:'text-up', slow:'text-slow', down:'text-down', checking:'text-checking' }[status] || 'text-checking';
}
function statusBadgeClass(status) {
  return { up:'up', slow:'slow', down:'down', checking:'' }[status] || '';
}
function statusLabel(status) {
  return { up:'UP', slow:'SLOW', down:'DOWN', checking:'CHECKING' }[status] || 'CHECKING';
}
function cardClass(status) {
  return { up:'up', slow:'slow', down:'down', checking:'checking' }[status] || 'checking';
}

/* ─────────────────────────────────────────
   SPARKLINE
───────────────────────────────────────── */
function drawSparkline(canvas, history, status) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth  || canvas.parentElement.clientWidth  || 200;
  const h = canvas.clientHeight || 40;
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const data = history.length ? history : [0];
  const max  = Math.max(...data, 1);
  const min  = 0;
  const pts  = data.length;
  const padX = 4, padY = 6;

  const color = status === 'up' ? '#16a34a' : status === 'slow' ? '#d97706' : status === 'down' ? '#dc2626' : '#94a3b8';

  ctx.beginPath();
  data.forEach((v, i) => {
    const x = padX + (i / Math.max(pts - 1, 1)) * (w - padX * 2);
    const y = h - padY - ((v - min) / (max - min)) * (h - padY * 2);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = color;
  ctx.lineWidth   = 2;
  ctx.lineJoin    = 'round';
  ctx.stroke();

  // Fill under line
  const lastX = padX + ((pts - 1) / Math.max(pts - 1, 1)) * (w - padX * 2);
  ctx.lineTo(lastX, h);
  ctx.lineTo(padX, h);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '33');
  grad.addColorStop(1, color + '05');
  ctx.fillStyle = grad;
  ctx.fill();

  // Dots
  data.forEach((v, i) => {
    const x = padX + (i / Math.max(pts - 1, 1)) * (w - padX * 2);
    const y = h - padY - ((v - min) / (max - min)) * (h - padY * 2);
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  });
}

/* ─────────────────────────────────────────
   RENDER GRID (full re-render)
───────────────────────────────────────── */
function renderGrid() {
  const grid = document.getElementById('monitorGrid');
  grid.innerHTML = '';
  endpoints.forEach(ep => {
    const card = buildCardEl(ep);
    grid.appendChild(card);
  });
  // Draw all sparklines after DOM is ready
  requestAnimationFrame(() => {
    endpoints.forEach(ep => {
      const canvas = document.querySelector(`#card-${CSS.escape(ep.id)} .sparkline-canvas`);
      if (canvas && ep.history.length) drawSparkline(canvas, ep.history, ep.status);
    });
  });
}

function buildCardEl(ep) {
  const div = document.createElement('div');
  div.className = `card ${cardClass(ep.status)}`;
  div.id = 'card-' + ep.id;
  div.innerHTML = cardHTML(ep);
  return div;
