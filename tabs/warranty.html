<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extended Warranty</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--border:#e2e8f0;
  --navy:#1e3a5f;--text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --green:#16a34a;--blue:#1d4ed8;--amber:#b45309;--red:#dc2626;
  --font:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);padding:20px;font-size:14px;line-height:1.5}

h2{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text3);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);
}
h2:first-of-type{margin-top:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:4px}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;display:flex;align-items:flex-start;gap:12px;
  text-decoration:none;color:var(--text);
  box-shadow:0 1px 3px rgba(0,0,0,.04);transition:all .15s;
}
.card:hover{border-color:var(--navy);box-shadow:0 4px 12px rgba(30,58,95,.12);transform:translateY(-1px)}
.card.static{cursor:default}
.card.static:hover{border-color:var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);transform:none}

.logo{
  width:38px;height:38px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.logo img{width:30px;height:30px;object-fit:contain}
.logo-text{font-size:12px;font-weight:800;color:var(--navy);text-align:center;line-height:1.2}

.info{min-width:0;flex:1}
.name{font-weight:700;font-size:14px;color:var(--text);line-height:1.3}
.desc{font-size:12px;color:var(--text2);margin-top:3px}

.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.badge{
  display:inline-block;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:5px;white-space:nowrap;
}
.badge-phone{background:#dcfce7;color:var(--green)}
.badge-email{background:#f3e8ff;color:#7c3aed}
.badge-hours{background:#fef3c7;color:var(--amber)}
.badge-link{background:#dbeafe;color:var(--blue)}
</style>
</head>
<body>

<h2>Extended Warranty Providers</h2>
<div class="grid">

  <a class="card" href="https://www.assurant.com/claims-and-support" target="_blank">
    <div class="logo"><img src="https://favicon.im/assurant.com" onerror="this.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'"></div>
    <div class="info">
      <div class="name">Assurant</div>
      <div class="desc">Claims and support portal</div>
      <div class="badges">
        <span class="badge badge-phone">800-621-2130</span>
        <span class="badge badge-link">Claims Portal</span>
      </div>
    </div>
  </a>

  <a class="card" href="https://www.zurichna.com/claims/report-a-claim/vehicle-owners" target="_blank">
    <div class="logo"><img src="https://favicon.im/zurichna.com" onerror="this.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'"></div>
    <div class="info">
      <div class="name">Zurich</div>
      <div class="desc">Vehicle Service Contracts</div>
      <div class="badges">
        <span class="badge badge-phone">800-643-9059</span>
        <span class="badge badge-email">VSC.VISA@ZURICHNA.COM</span>
      </div>
    </div>
  </a>

  <div class="card static">
    <div class="logo"><img src="https://favicon.im/endurancewarranty.com" onerror="this.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'"></div>
    <div class="info">
      <div class="name">Endurance</div>
      <div class="desc">Extended vehicle warranty</div>
      <div class="badges">
        <span class="badge badge-phone">877-936-5845</span>
      </div>
    </div>
  </div>

  <a class="card" href="https://account.carshield.com/start-claim" target="_blank">
    <div class="logo"><img src="https://favicon.im/carshield.com" onerror="this.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'"></div>
    <div class="info">
      <div class="name">CarShield</div>
      <div class="desc">Start a claim online</div>
      <div class="badges">
        <span class="badge badge-phone">800-852-2502</span>
        <span class="badge badge-hours">Mon-Fri 8-5 MT / Sat 10-2</span>
      </div>
    </div>
  </a>

</div>

</body>
</html>
