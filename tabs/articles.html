<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article Numbers – Bridgestone Firestone Store Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9; --border:#e2e8f0;
    --accent:#e8292d; --accent2:#1e3a5f;
    --text:#0f172a; --text2:#475569; --text3:#94a3b8;
    --green:#16a34a; --amber:#d97706; --red:#dc2626;
    --font:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  .page-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .page-header h1 {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent2);
    letter-spacing: -0.02em;
  }
  .page-header .logo-bar {
    width: 6px;
    height: 28px;
    background: var(--accent);
    border-radius: 3px;
  }
  .count-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--accent2);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
    min-width: 28px;
    letter-spacing: 0.03em;
  }
  .header-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .card-title {
    font-size: 0.82rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text2);
    margin-bottom: 14px;
  }

  /* ── Buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    font-family: var(--font);
    font-size: 0.83rem;
    font-weight: 600;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s, opacity .15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface2); }
  .btn-primary {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #fff;
  }
  .btn-primary:hover { background: #162d4f; border-color: #162d4f; }
  .btn-accent {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-accent:hover { background: #c9242a; border-color: #c9242a; }
  .btn-danger {
    border-color: var(--red);
    color: var(--red);
    background: var(--surface);
  }
  .btn-danger:hover { background: #fff1f1; }
  .btn-sm {
    padding: 5px 10px;
    font-size: 0.78rem;
  }
  .btn-icon {
    width: 30px;
    height: 30px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
  }

  /* ── Add Article Form ── */
  .add-form {
    display: grid;
    grid-template-columns: 140px 1fr 1fr 1fr 110px 1fr auto;
    gap: 10px;
    align-items: end;
  }
  @media (max-width: 900px) {
    .add-form { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 520px) {
    .add-form { grid-template-columns: 1fr; }
  }

  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--font);
    font-size: 0.85rem;
    color: var(--text);
    background: var(--surface);
    transition: border-color .15s, box-shadow .15s;
    outline: none;
  }
  .form-group input:focus,
  .form-group select:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(30,58,95,.1);
  }
  .form-group input.mono-input {
    font-family: var(--mono);
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  /* ── Search / Filter Bar ── */
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    padding: 8px 10px 8px 34px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--font);
    font-size: 0.85rem;
    color: var(--text);
    background: var(--surface);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-wrap input:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(30,58,95,.1);
  }
  .filter-select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--font);
    font-size: 0.85rem;
    color: var(--text);
    background: var(--surface);
    outline: none;
    cursor: pointer;
    min-width: 130px;
  }
  .filter-select:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(30,58,95,.1); }

  /* ── Table ── */
  .table-wrap {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  thead th {
    background: var(--surface2);
    padding: 10px 14px;
    text-align: left;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text2);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    user-select: none;
    cursor: pointer;
  }
  thead th.no-sort { cursor: default; }
  thead th:hover:not(.no-sort) { color: var(--accent2); }
  thead th .sort-indicator { margin-left: 4px; opacity: 0.4; font-size: 0.7rem; }
  thead th.sorted .sort-indicator { opacity: 1; color: var(--accent2); }

  tbody tr { border-bottom: 1px solid var(--border); transition: background .12s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 10px 14px; color: var(--text); vertical-align: middle; }

  .cell-num {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.88rem;
    color: var(--accent2);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .cell-price {
    font-family: var(--mono);
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .cell-notes {
    color: var(--text2);
    font-size: 0.82rem;
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cell-desc { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Category Badges ── */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .badge-tire    { background: #dbeafe; color: #1d4ed8; }
  .badge-oil     { background: #dcfce7; color: #15803d; }
  .badge-labor   { background: #fef3c7; color: #b45309; }
  .badge-parts   { background: #f3e8ff; color: #7c3aed; }
  .badge-discount{ background: #fee2e2; color: #b91c1c; }
  .badge-misc    { background: #f1f5f9; color: #475569; border: 1px solid var(--border); }

  /* ── Empty State ── */
  .empty-row td {
    text-align: center;
    padding: 40px 20px;
    color: var(--text3);
    font-size: 0.9rem;
  }
  .empty-icon { font-size: 2rem; margin-bottom: 8px; display: block; }

  /* ── Toast ── */
  #toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 9999;
    pointer-events: none;
  }
  .toast {
    background: var(--accent2);
    color: #fff;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 500;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .25s, transform .25s;
    pointer-events: auto;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.toast-error { background: var(--red); }
  .toast.toast-success { background: var(--green); }

  /* ── Hidden file input ── */
  #csv-file-input { display: none; }

  /* ── Result count ── */
  .result-info {
    font-size: 0.8rem;
    color: var(--text3);
    white-space: nowrap;
  }
</style>
</head>
<body>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- Hidden CSV file input -->
<input type="file" id="csv-file-input" accept=".csv,text/csv">

<!-- ══════════════════════════════════
     PAGE HEADER
══════════════════════════════════ -->
<div class="page-header">
  <div class="logo-bar"></div>
  <h1>Article Numbers</h1>
  <span class="count-badge" id="count-badge">0</span>
  <div class="header-actions">
    <button class="btn btn-primary" id="btn-export-csv">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export CSV
    </button>
    <button class="btn" id="btn-import-csv">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/><polyline points="17 14 12 9 7 14"/><line x1="12" y1="9" x2="12" y2="21"/></svg>
      Import CSV
    </button>
  </div>
</div>

<!-- ══════════════════════════════════
     ADD ARTICLE FORM
══════════════════════════════════ -->
<div class="card">
  <div class="card-title">Add New Article</div>
  <div class="add-form" id="add-form">
    <div class="form-group">
      <label>Article #</label>
      <input type="text" id="f-num" class="mono-input" placeholder="e.g. 7001718" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="f-cat">
        <option value="tire">Tire</option>
        <option value="oil">Oil</option>
        <option value="labor">Labor</option>
        <option value="parts">Parts</option>
        <option value="discount">Discount</option>
        <option value="misc" selected>Misc</option>
      </select>
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" id="f-desc" placeholder="Short description" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Supplier</label>
      <input type="text" id="f-sup" placeholder="Supplier name" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Price</label>
      <input type="text" id="f-price" placeholder="$0.00" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Notes</label>
      <input type="text" id="f-notes" placeholder="Optional notes" autocomplete="off">
    </div>
    <div class="form-group">
      <label style="visibility:hidden">Add</label>
      <button class="btn btn-accent" id="btn-add">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════
     SEARCH / FILTER TOOLBAR
══════════════════════════════════ -->
<div class="card" style="padding:14px 20px;">
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Search article #, description, supplier…">
    </div>
    <select class="filter-select" id="cat-filter">
      <option value="all">All Categories</option>
      <option value="tire">Tire</option>
      <option value="oil">Oil</option>
      <option value="labor">Labor</option>
      <option value="parts">Parts</option>
      <option value="discount">Discount</option>
      <option value="misc">Misc</option>
    </select>
    <span class="result-info" id="result-info"></span>
  </div>
</div>

<!-- ══════════════════════════════════
     ARTICLE TABLE
══════════════════════════════════ -->
<div class="card" style="padding:0; overflow:hidden;">
  <div class="table-wrap">
    <table id="articles-table">
      <thead>
        <tr>
          <th data-col="num">Article # <span class="sort-indicator">↕</span></th>
          <th data-col="cat">Category <span class="sort-indicator">↕</span></th>
          <th data-col="desc">Description <span class="sort-indicator">↕</span></th>
          <th data-col="sup">Supplier <span class="sort-indicator">↕</span></th>
          <th data-col="price">Price <span class="sort-indicator">↕</span></th>
          <th class="no-sort">Notes</th>
          <th class="no-sort" style="width:60px; text-align:center;">Del</th>
        </tr>
      </thead>
      <tbody id="table-body">
      </tbody>
    </table>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════════ */
const DISPATCH_URL   = 'https://n8n.646202.com/webhook/dispatch';
const DISPATCH_TOKEN = 'a7fe255af893c3321935d0acc41f199a252e0392de13468cd31f195171baf4c8';
const SMS_WEBHOOK    = 'https://n8n.646202.com/webhook/sms';
const SMS_FROM       = '+15852572886';
const OWM_KEY        = 'c736ec887059fc3a4950e643c439b316';
const PHONEBOOK_URL  = '/data/phonebook.json';
const TRIAGE_URL     = '/data/triage.json';
const ARTICLES_URL   = '/data/articles.json';
const LS_KEY         = 'articles646202';

const DEFAULT_ARTICLES = [
  { id: uid(), num: '7001718', cat: 'misc', desc: 'Discount all', sup: '', price: '', notes: '' }
];

/* ═══════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════ */
let articles = [];
let sortCol  = 'num';
let sortDir  = 1; // 1=asc, -1=desc

/* ═══════════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════════ */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function toast(msg, type = '') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' toast-' + type : '');
  t.textContent = msg;
  c.appendChild(t);
  requestAnimationFrame(() => { t.classList.add('show'); });
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 3000);
}

function catLabel(cat) {
  const map = { tire:'Tire', oil:'Oil', labor:'Labor', parts:'Parts', discount:'Discount', misc:'Misc' };
  return map[cat] || cat;
}

function catBadge(cat) {
  return `<span class="badge badge-${cat}">${catLabel(cat)}</span>`;
}

function fmtPrice(p) {
  if (!p) return '—';
  const n = parseFloat(p);
  if (isNaN(n)) return p;
  return '$' + n.toFixed(2);
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══════════════════════════════════════════════════════
   PERSISTENCE  –  GET /data/articles.json  →  localStorage fallback
═══════════════════════════════════════════════════════ */
async function loadArticles() {
  // Try remote first
  try {
    const res = await fetch(ARTICLES_URL, { cache: 'no-cache' });
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data)) {
        // Ensure each has an id
        articles = data.map(a => ({ id: a.id || uid(), num: a.num||'', cat: a.cat||'misc',
          desc: a.desc||'', sup: a.sup||'', price: a.price||'', notes: a.notes||'' }));
        lsSave();
        return;
      }
    }
  } catch(e) { /* fallthrough */ }

  // Try localStorage
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data) && data.length > 0) {
        articles = data;
        return;
      }
    }
  } catch(e) { /* fallthrough */ }

  // Default seed
  articles = DEFAULT_ARTICLES.map(a => ({ ...a }));
  lsSave();
}

function lsSave() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(articles)); } catch(e) {}
}

async function saveArticles() {
  lsSave();
  try {
    await fetch(ARTICLES_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(articles)
    });
  } catch(e) { /* silent – localStorage is authoritative */ }
}

/* ═══════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════ */
function getFiltered() {
  const q    = document.getElementById('search-input').value.trim().toLowerCase();
  const cat  = document.getElementById('cat-filter').value;

  return articles.filter(a => {
    const matchCat  = cat === 'all' || a.cat === cat;
    const matchQ    = !q ||
      a.num.toLowerCase().includes(q)  ||
      a.desc.toLowerCase().includes(q) ||
      a.sup.toLowerCase().includes(q)  ||
      a.notes.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
}

function sortArticles(list) {
  return [...list].sort((a, b) => {
    let av = (a[sortCol] || '').toString().toLowerCase();
    let bv = (b[sortCol] || '').toString().toLowerCase();
    // numeric sort for price
    if (sortCol === 'price') {
      av = parseFloat(av) || 0;
      bv = parseFloat(bv) || 0;
      return (av - bv) * sortDir;
    }
    if (av < bv) return -1 * sortDir;
    if (av > bv) return  1 * sortDir;
    return 0;
  });
}

function render() {
  const filtered = getFiltered();
  const sorted   = sortArticles(filtered);
  const tbody    = document.getElementById('table-body');

  // Update count badge (total)
  document.getElementById('count-badge').textContent = articles.length;
  document.getElementById('result-info').textContent =
    filtered.length === articles.length
      ? `${articles.length} article${articles.length !== 1 ? 's' : ''}`
      : `${filtered.length} of ${articles.length} articles`;

  // Update sort header indicators
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    const col = th.dataset.col;
    th.classList.toggle('sorted', col === sortCol);
    const ind = th.querySelector('.sort-indicator');
    if (ind) ind.textContent = col === sortCol ? (sortDir === 1 ? '↑' : '↓') : '↕';
  });

  if (sorted.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="7">
      <span class="empty-icon">📋</span>
      No articles found. Add one above or adjust your search.
    </td></tr>`;
    return;
  }

  tbody.innerHTML = sorted.map(a => `
    <tr data-id="${escHtml(a.id)}">
      <td class="cell-num">${escHtml(a.num) || '—'}</td>
      <td>${catBadge(a.cat)}</td>
      <td class="cell-desc" title="${escHtml(a.desc)}">${escHtml(a.desc) || '<span style="color:var(--text3)">—</span>'}</td>
      <td style="color:var(--text2)">${escHtml(a.sup) || '<span style="color:var(--text3)">—</span>'}</td>
      <td class="cell-price">${fmtPrice(a.price)}</td>
      <td class="cell-notes" title="${escHtml(a.notes)}">${escHtml(a.notes) || '<span style="color:var(--text3)">—</span>'}</td>
      <td style="text-align:center;">
        <button class="btn btn-danger btn-sm btn-icon btn-delete" data-id="${escHtml(a.id)}" title="Delete">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </td>
    </tr>
  `).join('');
}

/* ═══════════════════════════════════════════════════════
   ADD ARTICLE
═══════════════════════════════════════════════════════ */
function addArticle() {
  const num   = document.getElementById('f-num').value.trim();
  const cat   = document.getElementById('f-cat').value;
  const desc  = document.getElementById('f-desc').value.trim();
  const sup   = document.getElementById('f-sup').value.trim();
  const price = document.getElementById('f-price').value.trim();
  const notes = document.getElementById('f-notes').value.trim();

  if (!num) {
    toast('Article # is required', 'error');
    document.getElementById('f-num').focus();
    return;
  }

  // Duplicate check
  if (articles.some(a => a.num === num)) {
    toast(`Article # "${num}" already exists`, 'error');
    return;
  }

  articles.push({ id: uid(), num, cat, desc, sup, price, notes });
  saveArticles();
  render();
  toast
