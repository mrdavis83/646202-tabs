<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Articles — Store 646202</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--border:#e2e8f0;--accent:#e8292d;--accent2:#1e3a5f;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);padding:20px;font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{font-family:var(--font);font-size:13px;border:1px solid var(--border);border-radius:6px;padding:7px 11px;outline:none;background:var(--surface);color:var(--text)}
.toolbar input{flex:1;min-width:180px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent2)}
.count{font-size:12px;color:var(--text3);margin-left:auto;white-space:nowrap}
.add-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.add-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:10px}
.add-form{display:grid;grid-template-columns:100px 70px 110px 1fr 1fr auto;gap:8px;align-items:end}
.fl{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:3px}
.fi{width:100%;font-family:var(--font);font-size:13px;border:1px solid var(--border);border-radius:6px;padding:7px 10px;outline:none;background:var(--surface);color:var(--text)}
.fi:focus{border-color:var(--accent2)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn-primary:hover{background:#162d4a}
.btn-sm{padding:4px 9px;font-size:12px}
.btn-danger{border-color:#fca5a5;color:#dc2626}
.btn-danger:hover{background:#fef2f2}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700;text-transform:uppercase}
.cat-labor{background:#fef9c3;color:#854d0e}
.cat-parts{background:#dbeafe;color:#1d4ed8}
.cat-tire{background:#f3e8ff;color:#6b21a8}
.cat-oil{background:#dcfce7;color:#15803d}
.cat-misc{background:#f1f5f9;color:#475569}
.cat-discount{background:#fee2e2;color:#b91c1c}
@media(max-width:768px){.add-form{grid-template-columns:1fr 1fr}}

.cat-custom { background:#f0f4ff; color:#3730a3; }

.editable-cell:hover { border-color: var(--border) !important; background: var(--surface2) !important; cursor: text; }
.editable-cell:focus { border-color: var(--accent2) !important; background: var(--surface) !important; }
.inline-cat-select:hover { border-color: var(--border) !important; background: var(--surface2) !important; }

th .sort-icon { font-size:10px; opacity:0.4; margin-left:3px; }
th:hover { background: #e2e8f0 !important; }
th:hover .sort-icon { opacity:0.7; }
th.sort-active { color: var(--accent2); }
th.sort-active .sort-icon { opacity:1; color: var(--accent2); }

#check-all, .row-check { accent-color: var(--accent2); }
tr:has(.row-check:checked) td { background: #eff6ff !important; }

.desc-cell[contenteditable="false"] { cursor: default !important; }
.desc-cell[contenteditable="false"]:hover { border-color: transparent !important; background: transparent !important; }
.desc-cell[contenteditable="true"] { cursor: text !important; }
</style>
</head>

<div class="add-card">
  <div class="add-title">Add Article Number</div>
  <div class="add-form">
    <div><label class="fl">Article #</label><input class="fi" id="a-num" placeholder="7004578" style="font-family:var(--mono);letter-spacing:0.05em"></div>

          style="cursor:pointer" readonly onclick="toggleCatDropdown()">
        <div id="cat-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:100;max-height:220px;overflow-y:auto">

            <div style="display:flex;gap:6px">
              <input id="cat-new-input" placeholder="New category..." 
                style="flex:1;font-family:var(--font);font-size:12px;border:1px solid var(--border);border-radius:5px;padding:5px 8px;outline:none"
                onkeydown="if(event.key==='Enter')addCategory()">
              <button onclick="addCategory()" style="padding:4px 10px;background:var(--accent2);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600">+ Add</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div><label class="fl">Description</label><input class="fi" id="a-desc" placeholder="Description"></div>
    <div><label class="fl">Notes</label><input class="fi" id="a-notes" placeholder="Optional"></div>
    <div style="padding-top:17px"><button class="btn btn-primary" onclick="addArticle()">+ Add</button></div>
  </div>
</div>

<div class="toolbar">
  <input id="art-search" placeholder="🔍 Search article numbers..." oninput="render()">

  <button class="btn btn-sm" onclick="exportCSV()">⬇ Export CSV</button>
  <span class="count" id="art-count"></span>

let articles = BUILTIN.slice(); // start with baked data immediately
let serverLoaded = false;

function render() {
  const q = (document.getElementById('art-search').value || '').toLowerCase();
  const cat = document.getElementById('art-cat-filter').value;
  const tbody = document.getElementById('articles-tbody');
  const filtered = articles.filter(a =>
    (cat === 'all' || a.cat === cat) &&
    (!q || (a.num + ' ' + a.desc).toLowerCase().includes(q))
  );
  document.getElementById('art-count').textContent = filtered.length + ' of ' + articles.length + ' articles';
  // styles applied after render below
  tbody.innerHTML = filtered.length === 0
    ? '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text3)">No articles match</td></tr>'
    : getSortedArticles(filtered).map(a => `<tr data-num="${a.num}" id="row-${a.num}">
  <td style="width:36px;text-align:center;padding:8px 4px">
    <input type="checkbox" class="row-check" data-num="${a.num}"
      onchange="toggleRowActions('${a.num}', this.checked)"
      style="cursor:pointer;width:15px;height:15px;accent-color:var(--accent2)">
  </td>
  <td style="width:95px;font-family:var(--mono);font-weight:700;white-space:nowrap;padding:8px 8px">${a.num}</td>
  <td style="width:80px;padding:8px 8px;text-align:center;font-family:var(--mono)">
    <span class="editable-cell" data-num="${a.num}" data-field="price"
      contenteditable="true" spellcheck="false"
      onblur="updateField('${a.num}','price',this.innerText.trim())"
      onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
      style="display:inline-block;padding:2px 4px;border-radius:4px;border:1px solid transparent;outline:none"
      onfocus="this.style.borderColor='var(--accent2)';this.style.background='var(--surface)'"
      >${a.price||''}</span>
  </td>
  <td style="width:115px;padding:8px 4px">
    <select class="inline-cat-select" data-num="${a.num}" onchange="updateField('${a.num}','cat',this.value)"
      style="font-family:var(--font);font-size:12px;border:1px solid transparent;border-radius:4px;padding:2px 6px;background:transparent;cursor:pointer;font-weight:700;outline:none;width:auto;max-width:110px"
      onfocus="this.style.borderColor='var(--accent2)';this.style.background='var(--surface)'"
      onblur="this.style.borderColor='transparent';this.style.background='transparent'">
      ${categories.map(c => `<option value="${c}" ${a.cat===c?'selected':''}>${c.charAt(0).toUpperCase()+c.slice(1)}</option>`).join('')}
    </select>
  </td>
  <td style="padding:8px 8px">
    <span class="editable-cell desc-cell" id="desc-${a.num}" data-num="${a.num}" data-field="desc"
      contenteditable="false" spellcheck="false"
      onblur="updateField('${a.num}','desc',this.innerText.trim());lockDesc('${a.num}')"
      onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
      style="display:block;padding:2px 4px;border-radius:4px;border:1px solid transparent;outline:none;font-weight:500;cursor:default;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
      >${a.desc||''}</span>
  </td>
  <td style="width:130px;padding:6px 8px">
    <span class="editable-cell" data-num="${a.num}" data-field="notes"
      contenteditable="true" spellcheck="false"
      onblur="updateField('${a.num}','notes',this.innerText.trim())"
      onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
      style="display:block;padding:2px 4px;border-radius:4px;border:1px solid transparent;outline:none;color:var(--text3);font-size:12px"
      onfocus="this.style.borderColor='var(--accent2)';this.style.background='var(--surface)'"
      >${a.notes||''}</span>
  </td>
  <td style="width:145px"></td>
</tr>`).join('');
  // Apply badge styles to selects after render
  document.querySelectorAll('.inline-cat-select').forEach(sel => applyCatStyle(sel));
}

function save() {
  try { localStorage.setItem('articles646202', JSON.stringify(articles)); } catch(e) {}
  if (!serverLoaded) return; // never overwrite server until we've confirmed what's there
  fetch('/data/articles.json', {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(articles)
  }).catch(() => {});
}

function addArticle() {
  const num = (document.getElementById('a-num').value || '').trim();
  if (!num) { document.getElementById('a-num').focus(); return; }
  if (articles.find(a => a.num === num)) { alert('Article # ' + num + ' already exists'); return; }
  articles.push({
    num, cat: (document.getElementById('a-cat').value||'misc').toLowerCase().trim(),
    desc: (document.getElementById('a-desc').value || '').trim(),
    
    price:(document.getElementById('a-price').value|| '').trim(),
    notes:(document.getElementById('a-notes').value|| '').trim()
  });
  save(); render();
  ['a-num','a-desc','a-price','a-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('a-num').focus();
}

window.delArticle = num => {
  if (!confirm('Delete article #' + num + '?')) return;
  articles = articles.filter(a => a.num !== num);
  save(); render();
};

function exportCSV() {
  const rows = [['Article #','Price','Category','Description','Notes']];
  articles.forEach(a => rows.push([a.num, a.price, a.cat, a.desc, a.notes]));
  const csv = rows.map(r => r.map(v => '"' + (v||'').replace(/"/g,'""') + '"').join(',')).join('\n');
  const el = document.createElement('a');
  el.href = 'data:text/csv,' + encodeURIComponent(csv);
  el.download = 'articles_646202.csv';
  el.click();
}



function updateField(num, field, value) {
  const a = articles.find(a => a.num === num);
  if (!a) return;
  if (a[field] === value) return; // no change
  a[field] = value;
  save();
  // Re-apply badge style if category changed
  if (field === 'cat') {
    const sel = document.querySelector(`select.inline-cat-select[data-num="${num}"]`);
    if (sel) applyCatStyle(sel);
  }
}

function applyCatStyle(sel) {
  const cat = sel.value || 'misc';
  const styles = {
    labor:    {bg:'#fef9c3', color:'#854d0e'},
    parts:    {bg:'#dbeafe', color:'#1d4ed8'},
    tire:     {bg:'#f3e8ff', color:'#6b21a8'},
    oil:      {bg:'#dcfce7', color:'#15803d'},
    misc:     {bg:'#f1f5f9', color:'#475569'},
    discount: {bg:'#fee2e2', color:'#b91c1c'},
  };
  const s = styles[cat] || {bg:'#f0f4ff', color:'#3730a3'};
  sel.style.background = s.bg;
  sel.style.color = s.color;
  sel.style.borderColor = 'transparent';
  sel.style.fontWeight = '700';
  sel.style.fontSize = '11px';
  sel.style.textTransform = 'uppercase';
  sel.style.letterSpacing = '0.04em';
}




function toggleRowActions(num, checked) {
  if (!checked) lockDesc(num);
  // Show/hide the shared action bar based on whether ANY box is checked
  const anyChecked = document.querySelectorAll('.row-check:checked').length > 0;
  const bar = document.getElementById('row-actions-bar');
  if (bar) bar.style.display = anyChecked ? 'flex' : 'none';
  // Update select-all checkbox state
  const all = document.querySelectorAll('.row-check');
  const allChecked = [...all].every(c => c.checked);
  const anyChecked = [...all].some(c => c.checked);
  const selectAll = document.getElementById('check-all');
  if (selectAll) {
    selectAll.checked = allChecked;
    selectAll.indeterminate = anyChecked && !allChecked;
  }
}

function toggleAll(cb) {
  document.querySelectorAll('.row-check').forEach(c => {
    c.checked = cb.checked;
    if (!cb.checked) lockDesc(c.dataset.num);
  });
  const bar = document.getElementById('row-actions-bar');
  if (bar) bar.style.display = cb.checked ? 'flex' : 'none';
}

function editRow(num) {
  const descCell = document.getElementById('desc-' + num);
  if (!descCell) return;
  // Unlock
  descCell.contentEditable = 'true';
  descCell.style.cursor = 'text';
  descCell.style.borderColor = 'var(--accent2)';
  descCell.style.background = 'var(--surface)';
  descCell.focus();
  // Select all text
  const range = document.createRange();
  range.selectNodeContents(descCell);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function lockDesc(num) {
  const descCell = document.getElementById('desc-' + num);
  if (!descCell) return;
  descCell.contentEditable = 'false';
  descCell.style.cursor = 'default';
  descCell.style.borderColor = 'transparent';
  descCell.style.background = 'transparent';
}


function getCheckedNums() {
  return [...document.querySelectorAll('.row-check:checked')].map(c => c.dataset.num);
}

function editChecked() {
  const nums = getCheckedNums();
  if (nums.length === 1) editRow(nums[0]);
}

function saveChecked() {
  const nums = getCheckedNums();
  if (!nums.length) return;
  nums.forEach(num => {
    const a = articles.find(a => a.num === num);
    if (a) {
      // Grab any edited desc value
      const descEl = document.getElementById('desc-' + num);
      if (descEl) a.desc = descEl.innerText.trim();
    }
  });
  save();
  const btn = document.getElementById('global-save-btn');
  if (btn) {
    btn.textContent = 'Saved ✓';
    btn.style.background = '#16a34a';
    setTimeout(() => {
      // Uncheck all and hide bar
      document.querySelectorAll('.row-check:checked').forEach(cb => {
        cb.checked = false;
        lockDesc(cb.dataset.num);
      });
      const bar = document.getElementById('row-actions-bar');
      if (bar) bar.style.display = 'none';
      const allCb = document.getElementById('check-all');
      if (allCb) { allCb.checked = false; allCb.indeterminate = false; }
      btn.textContent = 'Save';
      btn.style.background = 'var(--accent2)';
    }, 1000);
  }
}

function delChecked() {
  const nums = getCheckedNums();
  if (!nums.length) return;
  if (!confirm('Delete ' + nums.length + ' article(s)?')) return;
  articles = articles.filter(a => !nums.includes(a.num));
  save(); render();
}

function saveRow(num, btn) {
  const a = articles.find(a => a.num === num);
  if (!a) return;
  save();
  // Flash saved
  const orig = btn.textContent;
  btn.textContent = 'Saved ✓';
  btn.style.background = '#16a34a';
  btn.style.borderColor = '#16a34a';
  setTimeout(() => {
    // Auto-uncheck and hide actions
    const cb = document.querySelector(`.row-check[data-num="${num}"]`);
    if (cb) { cb.checked = false; toggleRowActions(num, false); }
    lockDesc(num);
    // Reset button (may already be hidden but reset anyway)
    btn.textContent = orig;
    btn.style.background = 'var(--accent2)';
    btn.style.borderColor = 'var(--accent2)';
    // Update select-all state
    const allChecks = document.querySelectorAll('.row-check');
    const allChecked = [...allChecks].every(c => c.checked);
    const anyChecked = [...allChecks].some(c => c.checked);
    const selectAll = document.getElementById('check-all');
    if (selectAll) {
      selectAll.checked = allChecked;
      selectAll.indeterminate = anyChecked && !allChecked;
    }
  }, 1000);
}

// ── SORT ──
let sortField = null;
let sortDir = 1; // 1=asc, -1=desc

function sortBy(field) {
  if (sortField === field) {
    sortDir *= -1;
  } else {
    sortField = field;
    sortDir = 1;
  }
  // Update header indicators
  document.querySelectorAll('th[id^="th-"]').forEach(th => {
    th.classList.remove('sort-active');
  });
  document.querySelectorAll('.sort-icon').forEach(si => si.textContent = '');
  const activeTh = document.getElementById('th-' + field);
  const activeSi = document.getElementById('si-' + field);
  if (activeTh) activeTh.classList.add('sort-active');
  if (activeSi) activeSi.textContent = sortDir === 1 ? ' ▲' : ' ▼';
  render();
}

function getSortedArticles(arr) {
  if (!sortField) return arr;
  return [...arr].sort((a, b) => {
    const av = (a[sortField] || '').toLowerCase();
    const bv = (b[sortField] || '').toLowerCase();
    if (av < bv) return -1 * sortDir;
    if (av > bv) return  1 * sortDir;
    return 0;
  });
}

// ── CATEGORY MANAGEMENT ──
const DEFAULT_CATS = ['labor','parts','tire','oil','misc','discount'];
let categories = DEFAULT_CATS.slice();

function loadCategories() {
  try {
    const saved = JSON.parse(localStorage.getItem('artCategories646202') || 'null');
    if (Array.isArray(saved) && saved.length > 0) categories = saved;
  } catch(e) {}
}

function saveCategories() {
  try { localStorage.setItem('artCategories646202', JSON.stringify(categories)); } catch(e) {}
}

function rebuildCatFilter() {
  const sel = document.getElementById('art-cat-filter');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">All Categories</option>' +
    categories.map(c => `<option value="${c}"${c===cur?' selected':''}>${c.charAt(0).toUpperCase()+c.slice(1)}</option>`).join('');
}

function rebuildCatList() {
  const list = document.getElementById('cat-list');
  if (!list) return;
  const input = document.getElementById('a-cat');
  const q = (input ? input.value : '').toLowerCase();
  const filtered = categories.filter(c => !q || c.includes(q));
  list.innerHTML = filtered.map(c => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)"
      onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''"
      onclick="selectCategory('${c}')">
      <span>${c.charAt(0).toUpperCase()+c.slice(1)}</span>
      <button onclick="event.stopPropagation();removeCategory('${c}')" 
        style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0 2px;line-height:1"
        title="Remove category">✕</button>
    </div>`).join('') || '<div style="padding:8px 10px;color:var(--text3);font-size:12px">No categories found</div>';
}

function selectCategory(cat) {
  const input = document.getElementById('a-cat');
  if (input) input.value = cat;
  hideCatDropdown();
}

function showCatDropdown() {
  const dd = document.getElementById('cat-dropdown');
  if (dd) { dd.style.display = 'block'; rebuildCatList(); }
}

function hideCatDropdown() {
  const dd = document.getElementById('cat-dropdown');
  if (dd) dd.style.display = 'none';
}

function toggleCatDropdown() {
  const dd = document.getElementById('cat-dropdown');
  if (!dd) return;
  if (dd.style.display === 'none') showCatDropdown();
  else hideCatDropdown();
}

function filterCatDropdown() {
  rebuildCatList();
  showCatDropdown();
}

function addCategory() {
  const input = document.getElementById('cat-new-input');
  const val = (input ? input.value : '').trim().toLowerCase().replace(/\s+/g, '_');
  if (!val) return;
  if (categories.includes(val)) { selectCategory(val); return; }
  categories.push(val);
  saveCategories();
  rebuildCatFilter();
  rebuildCatList();
  if (input) input.value = '';
  selectCategory(val);
}

function removeCategory(cat) {
  if (!confirm(`Remove category "${cat}"?\n\nThis won't change existing articles.`)) return;
  categories = categories.filter(c => c !== cat);
  saveCategories();
  rebuildCatFilter();
  rebuildCatList();
  // If current add-form value was this cat, clear it
  const input = document.getElementById('a-cat');
  if (input && input.value === cat) input.value = '';
  render();
}

// Close dropdown when clicking outside
document.addEventListener('click', e => {
  const wrap = document.getElementById('cat-picker-wrap');
  if (wrap && !wrap.contains(e.target)) hideCatDropdown();
});

// Render immediately with baked data
loadCategories();
rebuildCatFilter();
render();

// Then fetch server version in background — use it if it has MORE entries (user added some)
fetch('/data/articles.json?_=' + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    serverLoaded = true;
    if (Array.isArray(d) && d.length >= BUILTIN.length) {
      articles = d;
      render();
    }
  })
  .catch(() => { serverLoaded = true; });
</script>
