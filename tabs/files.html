<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Files</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc; --surface: #ffffff; --surface2: #f1f5f9;
  --border: #e2e8f0; --accent: #e8292d; --navy: #1e3a5f;
  --text: #0f172a; --text2: #475569; --text3: #94a3b8;
  --green: #16a34a; --red: #dc2626; --amber: #d97706;
  --font: 'Inter', sans-serif; --mono: 'JetBrains Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); padding: 20px; font-size: 14px; }

/* Layout */
.layout { display: grid; grid-template-columns: 1fr 280px; gap: 16px; align-items: start; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

/* Card */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 14px; overflow: hidden; }
.card-hd { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); }
.card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text2); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-family: var(--font); font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s; white-space: nowrap; }
.btn:hover { background: var(--surface2); }
.btn-primary { background: var(--navy); color: #fff; border-color: var(--navy); }
.btn-primary:hover { opacity: .88; }
.btn-danger { color: var(--red); border-color: #fca5a5; }
.btn-danger:hover { background: #fef2f2; }
.btn-sm { padding: 4px 10px; font-size: 11px; }

/* Path bar */
.pathbar { display: flex; align-items: center; gap: 4px; padding: 8px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 12px; flex-wrap: wrap; min-height: 36px; }
.crumb { color: var(--navy); cursor: pointer; font-weight: 600; }
.crumb:hover { text-decoration: underline; }
.sep { color: var(--text3); }

/* Toolbar */
.toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.search { flex: 1; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-family: var(--font); font-size: 13px; outline: none; }
.search:focus { border-color: var(--navy); }
.sort-sel { padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; font-family: var(--font); font-size: 12px; background: var(--surface); color: var(--text); cursor: pointer; }

/* File list */
.file-row { display: flex; align-items: center; gap: 11px; padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
.file-row:last-child { border-bottom: none; }
.file-row:hover { background: var(--surface2); }
.file-row:hover .row-actions { opacity: 1; }
.file-icon { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-meta { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-top: 1px; }
.row-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; flex-shrink: 0; }

/* Empty / loading */
.msg-center { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; color: var(--text3); gap: 8px; }
.msg-center .big { font-size: 36px; }
.msg-center p { font-size: 12px; max-width: 220px; line-height: 1.6; }
.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--navy); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Drop zone */
.drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 30px 20px; text-align: center; cursor: pointer; transition: all .2s; }
.drop-zone:hover, .drop-zone.over { border-color: var(--navy); background: #eef2fb; }
.dz-icon { font-size: 30px; margin-bottom: 8px; }
.dz-title { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }
.dz-sub { font-size: 11px; color: var(--text3); font-family: var(--mono); }
input[type=file] { display: none; }

/* Queue */
.queue-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.queue-item:last-child { border-bottom: none; }
.q-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.q-size { color: var(--text3); font-family: var(--mono); margin-left: 8px; flex-shrink: 0; }
.prog-wrap { height: 5px; background: var(--border); border-radius: 5px; margin: 8px 0 2px; overflow: hidden; }
.prog-bar { height: 100%; background: var(--navy); border-radius: 5px; transition: width .3s; width: 0; }
.prog-lbl { font-size: 11px; color: var(--text3); font-family: var(--mono); text-align: right; }
.banner { padding: 9px 12px; border-radius: 6px; font-size: 12px; margin-top: 10px; }
.banner-ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
.banner-err { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }

/* Bookmarks */
.bm-item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; margin-bottom: 6px; text-decoration: none; color: var(--text); transition: all .15s; }
.bm-item:hover { background: #e8eef8; border-color: var(--navy); }
.bm-icon { font-size: 18px; flex-shrink: 0; }
.bm-info { flex: 1; min-width: 0; }
.bm-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bm-url { font-size: 11px; color: var(--text3); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bm-form { display: none; flex-direction: column; gap: 7px; margin-top: 8px; padding: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; }
.bm-form.open { display: flex; }
.bm-form input, .bm-form select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-family: var(--font); font-size: 12px; outline: none; background: var(--surface); }
.bm-form input:focus, .bm-form select:focus { border-color: var(--navy); }

/* Recent */
.rc-row { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
.rc-row:last-child { border-bottom: none; }
.rc-row:hover { background: var(--surface2); }
.rc-icon { font-size: 17px; flex-shrink: 0; }
.rc-info { flex: 1; min-width: 0; }
.rc-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-time { font-size: 10px; color: var(--text3); font-family: var(--mono); }

/* Toast */
#toasts { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 6px; z-index: 9999; pointer-events: none; }
.toast { padding: 9px 16px; border-radius: 7px; font-size: 13px; font-weight: 600; color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.18); animation: tin .2s ease; pointer-events: auto; }
@keyframes tin { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.t-ok { background: var(--green); }
.t-err { background: var(--red); }
.t-info { background: var(--navy); }
</style>
</head>
<body>

<div class="layout">

  <!-- LEFT -->
  <div>

    <!-- FILE BROWSER -->
    <div class="card">
      <div class="card-hd">
        <span class="card-title">Files</span>
        <div style="display:flex;gap:6px;align-items:center">
          <span id="count" style="font-size:11px;font-family:var(--mono);color:var(--text3)"></span>
          <button class="btn btn-sm" onclick="loadDir(curPath)">Refresh</button>
          <button class="btn btn-sm btn-primary" onclick="newFolder()">+ Folder</button>
        </div>
      </div>
      <div class="pathbar" id="pathbar">
        <span class="crumb" onclick="loadDir('')">Root</span>
      </div>
      <div class="toolbar">
        <input class="search" id="searchBox" placeholder="Search files..." oninput="render()">
        <select class="sort-sel" id="sortSel" onchange="render()">
          <option value="name">Name A-Z</option>
          <option value="name-d">Name Z-A</option>
          <option value="size">Largest</option>
          <option value="date">Newest</option>
        </select>
      </div>
      <div id="fileList">
        <div class="msg-center"><div class="spinner"></div><p>Loading...</p></div>
      </div>
    </div>

    <!-- UPLOAD -->
    <div class="card">
      <div class="card-hd">
        <span class="card-title">Upload Files</span>
        <span style="font-size:11px;font-family:var(--mono);color:var(--text3)">appears in files/uploads/</span>
      </div>
      <div style="padding:14px">
        <div class="drop-zone" id="dropZone"
          onclick="document.getElementById('fileInput').click()"
          ondragover="evt(event);this.classList.add('over')"
          ondragleave="this.classList.remove('over')"
          ondrop="onDrop(event)">
          <div class="dz-icon">&#x1F4E4;</div>
          <div class="dz-title">Drop files here or click to browse</div>
          <div class="dz-sub">Max 50 MB per file</div>
        </div>
        <input type="file" id="fileInput" multiple onchange="queueFiles(this.files)">

        <div id="uploadPanel" style="display:none;margin-top:12px">
          <div id="queueList" style="margin-bottom:8px"></div>
          <div class="prog-wrap" id="progWrap" style="display:none">
            <div class="prog-bar" id="progBar"></div>
          </div>
          <div class="prog-lbl" id="progLbl" style="display:none"></div>
          <div id="uploadBanner" style="display:none"></div>
          <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
            <button class="btn" onclick="clearQueue()">Clear</button>
            <button class="btn btn-primary" id="upBtn" onclick="doUpload()">Upload</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- RIGHT -->
  <div>

    <!-- BOOKMARKS -->
    <div class="card">
      <div class="card-hd">
        <span class="card-title">Quick Access</span>
        <button class="btn btn-sm btn-primary" onclick="toggleBmForm()">+ Add</button>
      </div>
      <div style="padding:12px">
        <div id="bmList"></div>
        <div class="bm-form" id="bmForm">
          <div style="font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.06em">Add Bookmark</div>
          <input id="bmName" placeholder="Label (e.g. Price Sheet Q4)">
          <input id="bmUrl" placeholder="URL or /files/path/file.pdf">
          <select id="bmIcon">
            <option value="&#x1F4C4;">PDF / Doc</option>
            <option value="&#x1F4CA;">Spreadsheet</option>
            <option value="&#x1F5BC;">Image</option>
            <option value="&#x1F4C1;">Folder</option>
            <option value="&#x1F517;">Link</option>
          </select>
          <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:2px">
            <button class="btn btn-sm" onclick="toggleBmForm()">Cancel</button>
            <button class="btn btn-sm btn-primary" onclick="saveBm()">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- RECENT -->
    <div class="card">
      <div class="card-hd">
        <span class="card-title">Recent</span>
        <button class="btn btn-sm btn-danger" onclick="clearRecent()">Clear</button>
      </div>
      <div id="rcList">
        <div class="msg-center" style="padding:20px">
          <div class="big">&#x1F550;</div>
          <p>Opened files show up here.</p>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="toasts"></div>

<script>
'use strict';

const FILES  = '/files/';
const UPLOAD = '/data/uploads/';
// NOTE: /files/uploads/ is a symlink to /data/uploads/
// So uploaded files appear in the browser under Files > uploads/
const BM_KEY = 'files_bm_646202';
const RC_KEY = 'files_rc_646202';

let entries = [];
let curPath  = '';
let queue    = [];

// ─── Boot ────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  loadDir('');
  renderBm();
  renderRc();
});

// ─── Toast ───────────────────────────────────────────────────
function toast(msg, cls = 't-info', ms = 3000) {
  const box = document.getElementById('toasts');
  const el  = document.createElement('div');
  el.className = 'toast ' + cls;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => {
    el.style.cssText = 'opacity:0;transition:opacity .3s';
    setTimeout(() => el.remove(), 350);
  }, ms);
}

// ─── File browser ─────────────────────────────────────────────
async function loadDir(path) {
  curPath = path;
  buildPath(path);
  document.getElementById('fileList').innerHTML =
    '<div class="msg-center"><div class="spinner"></div><p>Loading...</p></div>';
  document.getElementById('count').textContent = '';
  try {
    const url = FILES + (path ? path.replace(/\/?$/, '/') : '');
    const r   = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const raw = await r.json();
    entries = Array.isArray(raw) ? raw : [];
    render();
  } catch (e) {
    entries = [];
    document.getElementById('fileList').innerHTML =
      '<div class="msg-center"><div class="big">&#x1F4C2;</div>' +
      '<p>Folder is empty or unreachable.<br>Upload files below or check server.</p></div>';
  }
}

function buildPath(path) {
  const bar   = document.getElementById('pathbar');
  const parts = path ? path.split('/').filter(Boolean) : [];
  let html    = '<span class="crumb" onclick="loadDir(\'\')">Root</span>';
  parts.forEach((p, i) => {
    const seg = parts.slice(0, i + 1).join('/');
    html += '<span class="sep">/</span>';
    html += '<span class="crumb" onclick="loadDir(\'' + seg + '\')">' + esc(p) + '</span>';
  });
  bar.innerHTML = html;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function icon(name, type) {
  if (type === 'directory') return '&#x1F4C1;';
  const e = (name.split('.').pop() || '').toLowerCase();
  const m = {
    pdf:'&#x1F4C4;', doc:'&#x1F4DD;', docx:'&#x1F4DD;', txt:'&#x1F4DD;',
    xls:'&#x1F4CA;', xlsx:'&#x1F4CA;', csv:'&#x1F4CA;',
    ppt:'&#x1F4CB;', pptx:'&#x1F4CB;',
    jpg:'&#x1F5BC;', jpeg:'&#x1F5BC;', png:'&#x1F5BC;', gif:'&#x1F5BC;', webp:'&#x1F5BC;',
    mp4:'&#x1F3AC;', mov:'&#x1F3AC;', mp3:'&#x1F3B5;', wav:'&#x1F3B5;',
    zip:'&#x1F5DC;', rar:'&#x1F5DC;', gz:'&#x1F5DC;',
    json:'&#x2699;', yml:'&#x2699;', yaml:'&#x2699;', sh:'&#x1F4BB;', py:'&#x1F4BB;',
    html:'&#x1F310;', htm:'&#x1F310;', js:'&#x1F310;'
  };
  return m[e] || '&#x1F4C4;';
}

function fmtSize(n) {
  if (!n) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}

function render() {
  const q   = document.getElementById('searchBox').value.toLowerCase();
  const srt = document.getElementById('sortSel').value;
  let list  = entries.filter(e => e.name.toLowerCase().includes(q));

  if (srt === 'name')   list.sort((a,b)=>a.name.localeCompare(b.name));
  if (srt === 'name-d') list.sort((a,b)=>b.name.localeCompare(a.name));
  if (srt === 'size')   list.sort((a,b)=>(b.size||0)-(a.size||0));
  if (srt === 'date')   list.sort((a,b)=>new Date(b.mtime||0)-new Date(a.mtime||0));
  list.sort((a,b)=>(b.type==='directory')-(a.type==='directory'));

  document.getElementById('count').textContent = list.length + ' item' + (list.length!==1?'s':'');

  if (!list.length) {
    document.getElementById('fileList').innerHTML =
      '<div class="msg-center"><div class="big">&#x1F50D;</div>' +
      '<p>' + (q?'No matches.':'Folder is empty. Upload files below.') + '</p></div>';
    return;
  }

  document.getElementById('fileList').innerHTML = list.map(e => {
    const isDir  = e.type === 'directory';
    const fp     = (curPath ? curPath + '/' : '') + e.name;
    const url    = FILES + fp;
    const dt=e.mtime?new Date(e.mtime):null;let ds='';if(dt&&!isNaN(dt)){let h=dt.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;ds=dt.toLocaleDateString()+' '+h+':'+String(dt.getMinutes()).padStart(2,'0')+' '+ap;}const meta=[fmtSize(e.size),ds].filter(Boolean).join(' · ');
    return '<div class="file-row" onclick="openEntry(\'' + fp + '\',\'' + (e.type||'file') + '\',\'' + url + '\')">' +
      '<div class="file-icon">' + icon(e.name, e.type) + '</div>' +
      '<div class="file-info">' +
        '<div class="file-name">' + esc(e.name) + '</div>' +
        (meta ? '<div class="file-meta">' + meta + '</div>' : '') +
      '</div>' +
      '<div class="row-actions">' +
        (!isDir ? '<button class="btn btn-sm" title="Download" onclick="event.stopPropagation();dlFile(\'' + url + '\',\'' + esc(e.name) + '\')">&#x2B07;</button>' : '') +
        '<button class="btn btn-sm btn-danger" title="Delete" onclick="event.stopPropagation();delFile(\'' + fp + '\',\'' + esc(e.name) + '\')">&#x1F5D1;</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function openEntry(fp, type, url) {
  if (type === 'directory') { loadDir(fp); return; }
  const name = fp.split('/').pop();
  addRc(name, url);
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

function dlFile(url, name) {
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  addRc(name, url);
}

async function delFile(fp, name) {
  if (!confirm('Delete "' + name + '"? This cannot be undone.')) return;
  try {
    const r = await fetch(FILES + fp, { method: 'DELETE' });
    if (r.ok || r.status === 204 || r.status === 404) {
      toast('Deleted: ' + name, 't-ok');
      loadDir(curPath);
    } else {
      toast('Delete failed: HTTP ' + r.status, 't-err');
    }
  } catch(e) { toast('Delete error: ' + e.message, 't-err'); }
}

async function newFolder() {
  const name = prompt('Folder name:');
  if (!name || !name.trim()) return;
  const clean = name.trim().replace(/[^a-zA-Z0-9_\-. ]/g,'');
  try {
    // Create via PUT a placeholder file then delete it — or just make the directory via exec
    // Simpler: PUT an empty .keep file inside the new dir
    const fp = (curPath ? curPath + '/' : '') + clean + '/.keep';
    const r  = await fetch(FILES + fp, { method: 'PUT', headers:{'Content-Type':'text/plain'}, body:'' });
    if (r.ok || r.status === 201) {
      toast('Folder created: ' + clean, 't-ok');
      loadDir(curPath);
    } else {
      // Falls back if /files/ doesn't have DAV PUT — just notify
      toast('Could not create folder via browser. Add via server.', 't-err');
    }
  } catch(e) { toast('Error: ' + e.message, 't-err'); }
}

// ─── Upload ───────────────────────────────────────────────────
function evt(e) { e.preventDefault(); e.stopPropagation(); }

function onDrop(e) {
  evt(e);
  document.getElementById('dropZone').classList.remove('over');
  queueFiles(e.dataTransfer.files);
}

function queueFiles(files) {
  if (!files.length) return;
  queue = Array.from(files);
  document.getElementById('uploadPanel').style.display = 'block';
  document.getElementById('queueList').innerHTML = queue.map(f =>
    '<div class="queue-item"><span class="q-name">' + esc(f.name) + '</span>' +
    '<span class="q-size">' + fmtSize(f.size) + '</span></div>'
  ).join('');
  document.getElementById('uploadBanner').style.display = 'none';
  document.getElementById('progBar').style.width = '0';
  document.getElementById('progWrap').style.display = 'none';
  document.getElementById('progLbl').style.display = 'none';
}

async function doUpload() {
  if (!queue.length) return;
  const btn = document.getElementById('upBtn');
  btn.disabled = true; btn.textContent = 'Uploading...';
  const pw  = document.getElementById('progWrap');
  const pb  = document.getElementById('progBar');
  const pl  = document.getElementById('progLbl');
  pw.style.display = 'block';
  pl.style.display = 'block';
  document.getElementById('uploadBanner').style.display = 'none';

  let ok = 0, fail = [];
  for (let i = 0; i < queue.length; i++) {
    const f = queue[i];
    pl.textContent = 'Uploading ' + (i+1) + ' / ' + queue.length + ': ' + f.name;
    pb.style.width = Math.round(i/queue.length*100) + '%';
    try {
      const r = await fetch(UPLOAD + encodeURIComponent(f.name), {
        method: 'PUT',
        headers: { 'Content-Type': f.type || 'application/octet-stream' },
        body: f
      });
      if (r.status === 201 || r.status === 204 || r.ok) { ok++; }
      else { fail.push(f.name + ' (HTTP ' + r.status + ')'); }
    } catch(e) { fail.push(f.name + ' (' + e.message + ')'); }
  }

  pb.style.width = '100%';
  pl.textContent = ok + ' / ' + queue.length + ' uploaded';

  const banner = document.getElementById('uploadBanner');
  banner.style.display = 'block';
  if (fail.length === 0) {
    banner.className = 'banner banner-ok';
    banner.textContent = ok + ' file' + (ok!==1?'s':'') + ' uploaded successfully.';
    toast(ok + ' file' + (ok!==1?'s':'') + ' uploaded', 't-ok');
    setTimeout(clearQueue, 800);
    loadDir('uploads');
  } else {
    banner.className = 'banner banner-err';
    banner.textContent = ok + ' uploaded. Failed: ' + fail.join(', ');
    toast(fail.length + ' file(s) failed', 't-err');
  }

  btn.disabled = false; btn.textContent = 'Upload';
}

function clearQueue() {
  queue = [];
  document.getElementById('uploadPanel').style.display = 'none';
  document.getElementById('fileInput').value = '';
  document.getElementById('progBar').style.width = '0';
  document.getElementById('uploadBanner').style.display = 'none';
}

// ─── Bookmarks ────────────────────────────────────────────────
function getBm() { try { return JSON.parse(localStorage.getItem(BM_KEY)||'[]'); } catch { return []; } }
function setBm(v) { try { localStorage.setItem(BM_KEY, JSON.stringify(v)); } catch {} }

function renderBm() {
  const bms = getBm();
  const el  = document.getElementById('bmList');
  if (!bms.length) {
    el.innerHTML = '<p style="font-size:12px;color:var(--text3);text-align:center;padding:8px 0">No bookmarks - add files for quick access.</p>';
    return;
  }
  el.innerHTML = bms.map((b,i) =>
    '<a class="bm-item" href="' + esc(b.url) + '" target="_blank" onclick="addRc(\'' + esc(b.name) + '\',\'' + esc(b.url) + '\')">' +
      '<div class="bm-icon">' + b.icon + '</div>' +
      '<div class="bm-info">' +
        '<div class="bm-name">' + esc(b.name) + '</div>' +
        '<div class="bm-url">' + esc(b.url) + '</div>' +
      '</div>' +
      '<button class="btn btn-sm btn-danger" title="Remove" onclick="event.preventDefault();event.stopPropagation();rmBm(' + i + ')">&#x2715;</button>' +
    '</a>'
  ).join('');
}

function toggleBmForm() { document.getElementById('bmForm').classList.toggle('open'); }

function saveBm() {
  const name = document.getElementById('bmName').value.trim();
  const url  = document.getElementById('bmUrl').value.trim();
  const icon = document.getElementById('bmIcon').value;
  if (!name || !url) { toast('Name and URL are required', 't-err'); return; }
  const bms = getBm();
  bms.push({ name, url, icon });
  setBm(bms);
  renderBm();
  document.getElementById('bmName').value = '';
  document.getElementById('bmUrl').value  = '';
  document.getElementById('bmForm').classList.remove('open');
  toast('Bookmark saved', 't-ok');
}

function rmBm(i) {
  const bms = getBm(); bms.splice(i,1); setBm(bms); renderBm();
}

// ─── Recent ───────────────────────────────────────────────────
function getRc() { try { return JSON.parse(localStorage.getItem(RC_KEY)||'[]'); } catch { return []; } }
function setRc(v) { try { localStorage.setItem(RC_KEY, JSON.stringify(v)); } catch {} }

function addRc(name, url) {
  let rc = getRc().filter(r => r.url !== url);
  rc.unshift({ name, url, ts: Date.now() });
  if (rc.length > 12) rc = rc.slice(0,12);
  setRc(rc); renderRc();
}

function renderRc() {
  const rc = getRc();
  const el = document.getElementById('rcList');
  if (!rc.length) {
    el.innerHTML = '<div class="msg-center" style="padding:18px"><div class="big">&#x1F550;</div><p>Opened files appear here.</p></div>';
    return;
  }
  el.innerHTML = rc.map(r => {
    const ago = timeAgo(r.ts);
    return '<div class="rc-row" data-url="' + esc(r.url) + '">' +
      '<div class="rc-icon">' + icon(r.name, 'file') + '</div>' +
      '<div class="rc-info">' +
        '<div class="rc-name">' + esc(r.name) + '</div>' +
        '<div class="rc-time">' + ago + '</div>' +
      '</div></div>';
  }).join('');
}

function clearRecent() { setRc([]); renderRc(); }

// Delegated click handler for recent rows (avoids popup blocker)
document.addEventListener('click', function(e) {
  const row = e.target.closest('.rc-row');
  if (!row) return;
  const url = row.dataset.url;
  if (!url) return;
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
});

function timeAgo(ts) {
  const s = Math.floor((Date.now()-ts)/1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
</script>
