<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>United Auto Supply - Connecting...</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100vh;gap:14px;text-align:center}
.logo{font-size:48px;font-weight:900;color:#e8292d}
.msg{font-size:15px;color:#94a3b8}
.count{font-size:42px;font-weight:700;color:#e8292d;min-width:60px}
.sub{font-size:12px;color:#334155}
</style>
</head>
<body>
<div class="logo">UAS</div>
<div class="msg">Logging in automatically in</div>
<div class="count" id="count">3</div>
<div class="sub">United Auto Supply</div>

<!-- Hidden form that posts directly to UAS wp-login -->
<form id="uasForm" method="POST" action="https://unitedautosupply.com/wp-login.php?wpe-login=true">
  <input type="hidden" name="log" value="UAS62722">
  <input type="hidden" name="pwd" value="U@S62722">
  <input type="hidden" name="rememberme" value="forever">
  <input type="hidden" name="wp-submit" value="Log In">
  <input type="hidden" name="redirect_to" value="https://unitedautosupply.com/">
  <input type="hidden" name="testcookie" value="1">
</form>

<script>
var n = 3;
var el = document.getElementById('count');
var interval = setInterval(function(){
  n--;
  el.textContent = n;
  if(n <= 0){
    clearInterval(interval);
    el.textContent = '...';
    document.getElementById('uasForm').submit();
  }
}, 1000);
</script>
</body>
</html>
